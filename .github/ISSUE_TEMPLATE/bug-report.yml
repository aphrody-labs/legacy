name: Bug report
description: Report an issue that should be fixed
labels:
  - bug
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report. Make sure you are running the latest `ay` (`ay up ay`): the bug may already be fixed.
  - type: input
    attributes:
      label: Which version is running?
      description: Copy the output of `ay --version`
  - type: input
    attributes:
      label: What platform is your computer?
      description: |
        Linux and macOS: copy the output of `uname -mprs`.
        Windows: copy the output of `ver` in a terminal.
  - type: textarea
    attributes:
      label: What steps can reproduce the bug?
      description: Explain the bug and provide the command or snippet that reproduces it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is the expected behavior?
      description: If possible, provide text instead of a screenshot.
  - type: textarea
    attributes:
      label: What do you see instead?
      description: If possible, provide text instead of a screenshot.
  - type: textarea
    attributes:
      label: Additional information
