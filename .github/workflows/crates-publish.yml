# crates.io publication without a long-lived token (docs/infra/GITHUB-APP.md, crates.io section).
# Trusted publishing: rust-lang/crates-io-auth-action exchanges the job's OIDC token (id-token: write) for a temporary
# crates.io token, revoked by the post step. Prerequisite per crate: a GitHub configuration registered on
# crates.io (repository aphrody-labs/src, workflow crates-publish.yml), set by
# `ay auth github-app crates-trust --crates a,b`; the first publish of a crate stays manual (crates.io rule).
name: crates-publish

on:
  workflow_dispatch:
    inputs:
      crates:
        description: "Workspace crates, separated by spaces, in dependency order"
        required: true
      dry_run:
        description: "cargo publish --dry-run (no OIDC exchange)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  publish:
    # The crates.io configuration authorizes the workflow, not the branch: only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: auth
        if: ${{ !inputs.dry_run }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: cargo publish
        env:
          CRATES: ${{ inputs.crates }}
          DRY_RUN: ${{ inputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for c in $CRATES; do
            [[ "$c" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::name refused: $c"; exit 1; }
            if [ "$DRY_RUN" = true ]; then cargo publish -p "$c" --dry-run; else cargo publish -p "$c"; fi
            echo "### $c $([ "$DRY_RUN" = true ] && echo '(dry-run)')" >> "$GITHUB_STEP_SUMMARY"
          done
