# CI apps/nt (merged from aphrody-labs/nt): every compilation happens here (no compilation on the owner's workstation).
# Windows: WinUI 3 shell (NativeAOT, unpackaged + MSIX signed with a test certificate), D3D12 probe (C++23 import std,
# vcpkg), WinUI sample in Rust (windows-reactor), GPU scene. Linux: lint and GPU scene.
# interop: .NET 11 -> bun without node-api-dotnet (NativeAOT + CoreCLR/hostfxr), generated bindings, tests and measurements.
# Action versions surveyed on 2026-11-12 (gh api repos/<action>/releases/latest).
name: nt
on:
  push:
    {
      branches: [main, dev],
      paths:
        ["apps/nt/**", "system/ffi-bridge/**", ".github/workflows/nt.yml"],
    }
  pull_request:
    {
      paths:
        ["apps/nt/**", "system/ffi-bridge/**", ".github/workflows/nt.yml"],
    }
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
defaults:
  run: { working-directory: apps/nt }
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    # packages: write: vcpkg binary cache on GitHub Packages (NuGet).
    permissions: { contents: read, packages: write }
    env:
      # Learn "Binary caching configuration": NuGet recommended for GitHub Packages; x-gha is removed from vcpkg.
      VCPKG_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      VCPKG_DISABLE_METRICS: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: apps/nt/global.json }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - uses: mozilla-actions/sccache-action@v0.0.11
      # DXC, Agility SDK, niubash (shell of the just recipes, added to PATH), CMake 4.5.0 and Ninja 1.13.2 (import std probe).
      - run: bun sdk/tools/fetch-tools.ts
      - run: just lint
      - run: just web
      # vcpkg cache (Learn "Set up a vcpkg binary cache using GitHub Packages") in a dedicated nuget.config, nugetconfig
      # provider (Learn "Binary caching configuration"): added to the user's nuget.config, the source broke the
      # .NET restore under central package management (NU1507: 2 sources without mapping), run 43282716395.
      - name: vcpkg binary cache (GitHub Packages)
        shell: bash
        run: |
          cfg="$RUNNER_TEMP/vcpkg-nuget.config"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<configuration><packageSources><clear /></packageSources></configuration>' > "$cfg"
          nuget=$("$VCPKG_INSTALLATION_ROOT/vcpkg.exe" fetch nuget | tail -n 1)
          "$nuget" sources add -ConfigFile "$cfg" -Source "$VCPKG_FEED" -StorePasswordInClearText -Name GitHubPackages \
            -UserName "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}"
          "$nuget" setapikey "${{ secrets.GITHUB_TOKEN }}" -Source "$VCPKG_FEED" -ConfigFile "$cfg"
          "$nuget" config -Set defaultPushSource="$VCPKG_FEED" -ConfigFile "$cfg"
          echo "VCPKG_BINARY_SOURCES=clear;nugetconfig,$cfg,readwrite" >> "$GITHUB_ENV"
      - run: just probe
      - run: just app
      # MSIX test certificate generated on each run (Learn "Create a certificate for package signing"), never versioned:
      # subject = Publisher of Package.appxmanifest; the key stays in RUNNER_TEMP, only the public .cer is published.
      - name: MSIX test certificate
        shell: pwsh
        run: |
          $pass = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$pass"
          $cert = New-SelfSignedCertificate -Type Custom -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') -Subject 'CN=aphrody-labs' -FriendlyName 'nt CI test'
          $pfx = Join-Path $env:RUNNER_TEMP 'nt-ci-test.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null
          New-Item -ItemType Directory -Force target/dotnet/msix | Out-Null
          Export-Certificate -Cert $cert -FilePath target/dotnet/msix/nt-ci-test.cer | Out-Null
          "NT_CERT=$pfx" >> $env:GITHUB_ENV
          "NT_CERT_PASSWORD=$pass" >> $env:GITHUB_ENV
      - run: just msix
      - name: winui-rs (windows-reactor)
        env: { RUSTC_WRAPPER: sccache, SCCACHE_GHA_ENABLED: "true" }
        run: just winui-rs
      - uses: actions/upload-artifact@v7
        with:
          name: nt-windows-x64
          path: |
            apps/nt/target/web/
            apps/nt/target/dotnet/publish/Nt.App/release_win-x64/
            apps/nt/target/dotnet/msix/**/*.msix
            apps/nt/target/dotnet/msix/nt-ci-test.cer
            apps/nt/target/cmake/nt-gpu-probe/windows/nt-gpu-probe.exe
            apps/nt/target/cmake/nt-gpu-probe/windows/D3D12/
            apps/nt/target/cargo/release/reactor-winui-hello.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: just lint
      - run: just web
  interop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: apps/nt/global.json }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      # niubash: shell of the just recipes on Windows.
      - if: runner.os == 'Windows'
        run: bun sdk/tools/fetch-tools.ts
      # NativeAOT on Linux: clang and zlib (Learn "Native AOT deployment", prerequisite).
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - run: just interop
      - run: just test-interop
      - run: just bench-interop
      - uses: actions/upload-artifact@v7
        with:
          name: interop-${{ runner.os }}
          path: |
            apps/nt/target/dotnet-ffi/
            apps/nt/target/bench/
          if-no-files-found: error
