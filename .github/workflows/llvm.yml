# LLVM tooling on the one toolchain of src (scripts/toolchain.ts: Chromium's clang, lld, llvm-* and the rustc on the
# same LLVM): sanitizers and static analysis of the C core, llvm-cov coverage of C and Rust, and the size report of a
# release binary. The C and coverage jobs run on GitHub-hosted runners, the release build of ay on the fr1 runners (aphrody-heavy).
name: llvm
on:
  push:
    branches: [main, dev]
    paths:
      - "kernel/Makefile"
      - "kernel/.clang-*"
      - "kernel/tests/**"
      - "kernel/core/**"
      - "system/wayland/**"
      - "system/nt/**"
      - "system/wine/**"
      - "kernel/wasm/**"
      - "frameworks/ui/*.c"
      - "hardware/drivers/**/*.c"
      - "kernel/arch/**"
      - "kernel/include/**"
      - "scripts/toolchain.ts"
      - "third_party/toolchain-*.toml"
      - ".github/workflows/llvm.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
concurrency:
  group: llvm-${{ github.sha }}
  cancel-in-progress: false
permissions: { contents: read }
env:
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: never
jobs:
  # The C core and the coverage jobs are light enough for a GitHub-hosted runner (they stay green while the fr1 runners are
  # being rebuilt); only the release build of ay needs the factory.
  c-core:
    name: C core (ASan + UBSan, clang-tidy, clang-format, size)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: { submodules: false, fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - name: Toolchain
        run: |
          bun scripts/toolchain.ts install
          bun scripts/toolchain.ts bin >> "$GITHUB_PATH"
      - name: Versions (rustc, clang, ld.lld of one LLVM)
        run: |
          rustc -vV
          "$(bun scripts/toolchain.ts bin)/clang" --version
          "$(bun scripts/toolchain.ts bin)/ld.lld" --version
      - name: ASan + UBSan over every exported function
        run: make -C src sanitize
      - name: clang-tidy
        run: make -C src tidy
      - name: clang-format (lines changed by the push)
        # clang-format is not in Chromium's clang package: the one of the runner image (apt). The sources
        # predate .clang-format, so only the lines a push touches are held to it (git-clang-format against the base).
        run: |
          base="${{ github.event.before }}"
          [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          command -v git-clang-format >/dev/null || sudo apt-get install -y clang-format
          out=$(git clang-format --diff "$base" -- 'kernel/**/*.c' 'kernel/**/*.h' 'hardware/**/*.c' 'system/**/*.c' 'system/**/*.h' 'frameworks/**/*.c' 'frameworks/**/*.h' || true)
          case "$out" in "no modified files to format" | "clang-format did not modify any files") exit 0 ;; esac
          echo "$out"; exit 1
      - name: Section sizes of libaysys.so (llvm-objdump)
        run: make -C src size | tee "$RUNNER_TEMP/libaysys-size.txt"
      - uses: actions/upload-artifact@v4
        with: { name: libaysys-size, path: "${{ runner.temp }}/libaysys-size.txt" }
  coverage:
    name: "coverage (llvm-cov of the C core and of Rust)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: { submodules: false }
      - uses: oven-sh/setup-bun@v2
      - name: Toolchain
        run: |
          bun scripts/toolchain.ts install
          bun scripts/toolchain.ts bin >> "$GITHUB_PATH"
      - name: C core coverage (sanitize driver, source-based, llvm-cov of the toolchain)
        working-directory: kernel
        run: |
          clang -std=gnu11 -O0 -funsigned-char -fno-common -Iinclude -fprofile-instr-generate -fcoverage-mapping \
            -fuse-ld=lld core/sys.c ../hardware/drivers/gpu/drm/drm_mesa.c ../src/wayland/wire.c ../src/wayland/xwm.c ../src/wayland/tiler.c \
            ../src/nt/status.c ../src/wine/server_proto.c wasm/module.c ../src/ui/m3.c ../src/ui/shell_kit.c ../src/ui/vterm.c arch/x86/entry_64.S \
            tests/sanitize.c -o "$RUNNER_TEMP/cov-c"
          LLVM_PROFILE_FILE="$RUNNER_TEMP/cov-c.profraw" "$RUNNER_TEMP/cov-c"
          llvm-profdata merge -sparse "$RUNNER_TEMP/cov-c.profraw" -o "$RUNNER_TEMP/cov-c.profdata"
          llvm-cov report "$RUNNER_TEMP/cov-c" -instr-profile="$RUNNER_TEMP/cov-c.profdata" \
            core ../src/wayland ../src/nt ../src/wine wasm ../src/ui ../hardware/drivers | tee "$RUNNER_TEMP/coverage-c.txt"
      - name: Rust coverage (cargo-llvm-cov on the chromium rustc, LLVM tools of the same revision)
        run: |
          command -v cargo-llvm-cov >/dev/null || cargo install --locked cargo-llvm-cov
          export LLVM_COV="$(command -v llvm-cov)" LLVM_PROFDATA="$(command -v llvm-profdata)"
          cargo llvm-cov --summary-only -p aphrody-core | tee "$RUNNER_TEMP/coverage-rust.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            ${{ runner.temp }}/coverage-c.txt
            ${{ runner.temp }}/coverage-rust.txt
  release-size:
    name: release binary size (llvm-objdump, llvm-nm)
    if: github.event_name != 'push'
    runs-on: [self-hosted, fr1]
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: /home/ubuntu/build/llvm-target
      HEAVY_WAIT_MAX: "2700"
    steps:
      - uses: actions/checkout@v7
        with: { submodules: false }
      - name: Toolchain
        run: |
          bun scripts/toolchain.ts install
          bun scripts/toolchain.ts bin >> "$GITHUB_PATH"
      - name: Release build of ay (profile release, strip off to read symbols)
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        run: aphrody-heavy cargo build --release -p aphrody --bin ay
      - name: Sections and the largest symbols
        run: |
          ay="$CARGO_TARGET_DIR/release/ay"
          { ls -l "$ay"; llvm-objdump -h "$ay"; llvm-nm --print-size --size-sort --radix=d "$ay" | tail -n 40; } | tee "$RUNNER_TEMP/ay-size.txt"
      - uses: actions/upload-artifact@v4
        with: { name: ay-size, path: "${{ runner.temp }}/ay-size.txt" }
