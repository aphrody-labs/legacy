name: layout

# The tree matches tools/layout.toml: no moved path is left or referenced, every Cargo member and path dependency
# resolves, the Bun workspaces install from the lockfile, the dependency layers hold. Runs on GitHub-hosted runners
# (no compilation), so it does not depend on the fr1 runners.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun scripts/relayout.ts check --upto 5
      - run: bun install --frozen-lockfile
      # rust-toolchain.toml names a local toolchain (chromium-160); the manifests only need a nightly cargo to resolve
      - run: |
          rustup toolchain install nightly --profile minimal
          RUSTUP_TOOLCHAIN=nightly cargo metadata --format-version 1 > /dev/null
      - run: |
          bun scripts/checkdeps.ts | tee checkdeps.out || true
          # three known upward or unknown-unit errors are the baseline
          test "$(grep -c '^ERROR' checkdeps.out)" -le 3

  # Compile check of crates that read paths across the moved trees (path dependencies, include!, build.rs). The full
  # workspace builds on the fr1 runners (ci.yml); this job runs where those are offline and only informs.
  rust-subset:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - run: RUSTUP_TOOLCHAIN=nightly cargo check -p taffy -p xtk -p bun_errno -p aphrody-core
