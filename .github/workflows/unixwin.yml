# unixwin fusion on real Windows: `ay applet` (WinuxCmd Rust library, in process) and the uutils multicall run the
# WinuxCmd GNU-master corpus (tests/differential/master-cases.json, byte-compared stdout, stderr and exit status) against results
# recorded from GNU coreutils on Linux. The WinuxCmd checkout is the fork at the src.lock.json pin.
name: unixwin
on:
  push:
    branches: [main]
    paths:
      - "src/winux/**"
      - "src/ay/**"
      - "src/up/**"
      - "infra/os/unixwin/**"
      - "scripts/unixwin-applets.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/unixwin.yml"
  workflow_dispatch:
concurrency:
  group: unixwin-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: never
  # Python reads and writes the corpus bytes as UTF-8 whatever the Windows code page is.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
jobs:
  oracle:
    name: GNU results on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      winux_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: false }
      - uses: oven-sh/setup-bun@v2
      - id: pin
        name: WinuxCmd pin from src.lock.json
        run: |
          bun -e 'const l = await Bun.file("src.lock.json").json(); console.log("sha=" + l.repositories["third_party/WinuxCmd"].commit)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: aphrody-labs/WinuxCmd
          ref: ${{ steps.pin.outputs.sha }}
          path: winuxcmd
      - name: Record GNU coreutils results (distribution build)
        run: |
          /usr/bin/true --version | head -1
          python3 winuxcmd/tests/differential/master-oracle.py --gnu-bin /usr/bin --revision distro --record gnu-results.json --cases winuxcmd/tests/differential/master-cases.json
      - uses: actions/upload-artifact@v7
        with: { name: gnu-results, path: gnu-results.json, if-no-files-found: error }
  windows:
    name: ay applet and uutils on Windows
    needs: oracle
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # The git dependency on aphrody-labs/open (c-abi) checks out a whole repository with deep paths: keep CARGO_HOME short.
      CARGO_HOME: C:\cg
    steps:
      - name: Long paths
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force
          New-Item -ItemType Directory -Force C:\cg | Out-Null
      - uses: actions/checkout@v7
        with: { submodules: false }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v7
        with:
          repository: aphrody-labs/WinuxCmd
          ref: ${{ needs.oracle.outputs.winux_sha }}
          path: winuxcmd
      - uses: actions/download-artifact@v8
        with: { name: gnu-results }
      - name: Toolchain (the Chromium rust toolchain of scripts/toolchain.ts)
        run: bun scripts/toolchain.ts install
      # Nothing here names a toolchain generation: rust-toolchain.toml names the rustup toolchain and scripts/toolchain.ts knows its directory.
      # The Chromium rust toolchain carries no rust-lld: link with the lld-link of its LLVM, against the MSVC libraries.
      - name: Linker (lld-link of the Chromium LLVM)
        shell: pwsh
        run: |
          $dir = bun scripts/toolchain.ts bin
          $l = Join-Path $dir "lld-link.exe"
          if (-not (Test-Path $l)) { Get-ChildItem $dir | Select-Object -First 40 | ForEach-Object Name; exit 1 }
          "$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$l" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          rustc -vV; & (Join-Path $dir "clang-cl.exe") --version; & $l --version
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build ay (WinuxCmd library linked)
        run: cargo build --release -p aphrody --no-default-features
      - name: Unit tests of ay applet and ay sh
        run: cargo test --release -p aphrody --lib --no-default-features -- applet sh
      - name: uutils multicall for Windows (the executables behind the uutils providers)
        shell: pwsh
        run: |
          cargo install coreutils --locked --root uutils --features windows
          Join-Path $PWD "uutils/bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Unit tests of the Rust date applet (military zones, times of day)
        run: cargo test --release -p winux-cmds --lib -- date
      - name: Provider table and an applet in process
        shell: bash
        run: |
          target/release/ay applet --list > list.txt
          grep -q "^basename.winux$" list.txt
          target/release/ay applet basename /a/b.txt .txt > out.txt
          test "$(tr -d '\r' < out.txt)" = "b"
      # The proof of the Windows applets: each one runs for real and its output is compared with the expected bytes; the lines are the evidence.
      - name: Proof run (applets and ay sh against expected output)
        shell: bash
        run: |
          bun scripts/unixwin-proof.ts target/release/ay.exe --md proof-windows.md | tee proof-windows.txt
          cat proof-windows.md >> "$GITHUB_STEP_SUMMARY"
      - name: WinuxCmd corpus through ay applet (argv0 winuxcmd)
        shell: bash
        run: |
          cp target/release/ay.exe winuxcmd.exe
          python winuxcmd/tests/differential/master-oracle.py --winuxcmd ./winuxcmd.exe --compare gnu-results.json --cases winuxcmd/tests/differential/master-cases.json | tee winux-compare.txt
      # uutils is not the product under test here: its differences from GNU are data, reported in the job summary, not a gate.
      # The step itself must run (a missing binary or a crash of the harness stays red); only the differences are tolerated.
      - name: uutils against the same GNU results
        shell: bash
        run: |
          set +e
          python winuxcmd/tests/differential/master-oracle.py --winuxcmd ./uutils/bin/coreutils.exe --compare gnu-results.json --cases winuxcmd/tests/differential/master-cases.json | tee uutils-compare.txt
          code=${PIPESTATUS[0]}
          # exit 1 = differences found; anything else (2 = harness error, missing binary) is a failure of the step.
          { echo "### uutils on Windows against GNU"; tail -n 1 uutils-compare.txt; } >> "$GITHUB_STEP_SUMMARY"
          test "$code" = 0 -o "$code" = 1
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: windows-compare, path: "*-compare.txt" }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: windows-proof, path: "proof-windows.*" }
      # The binary the proof ran, for installing on the workstation (ay and niu run there; see docs/proofs).
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ay-windows-x86_64, path: target/release/ay.exe, if-no-files-found: error }
