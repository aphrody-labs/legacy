# Root uv workspace (virtual: no [project]). One uv.lock for every first-party Python project of src;
# apps/* submodules keep the lock of their own repository. Policy: docs/native/deps/POLICY.md.
[tool.uv.workspace]
members = [
  "tools/lore",
  "system/core-py",
  "src/agent/context",
  "frameworks/ai-os/python/hermes_agent_memory",
  "system/env-kit/loaders/python",
  "frameworks/re-ts/ghidra/scripts/parity",
  "system/machine-ts/matrix/scripts",
  "tools/factory",
]
