# The four products of the Cloudflare account and what belongs to each. Every Worker, R2 bucket, tunnel and zone of
# the account is listed under exactly one project; `bun device/cloudflare/projects.ts` fails on any resource that is in
# no project or that a project lists but the account no longer has (sync check, run by CI: .github/workflows/edge.yml).
#   repo      Git repository whose pushes deploy the project (GitHub Actions of that repo, secrets CLOUDFLARE_*)
#   zones     DNS zones the project owns; hostnames below the zone belong to it
#   tunnel    Cloudflare tunnel (named like the project) that carries its origin traffic; "" = none
#   workers   Workers; the sources live in the repo, deploys come from CI, not from the dashboard
#   buckets   R2 buckets (not renameable; one bucket per kind of content, 336 GB aphrody-archive is never copied)
# Adding a site to aphrody-sites (apps/r2-site) or a Worker: edit its wrangler config in the repo AND list it here.

[project.aphrody]
repo = "aphrody-labs/ay"
zones = ["aphrody.com", "aphrody.app"]
tunnel = "aphrody"
workers = ["aphrody", "aphrody-app", "aphrody-deploy", "aphrody-github", "aphrody-mcp-gateway", "aphrody-sites", "aphrody-webos", "api-aphrody-com", "bun-video-showcase"]
buckets = ["aphrody-archive", "aphrody-assets", "aphrody-chromium", "aphrody-dist", "aphrody-gnu", "aphrody-lore", "aphrody-skills-archive", "aphrody-video", "bun-lib"]

[project.shenron]
repo = "aphrody-labs/shenron"
zones = ["dragonballfr.com"]
tunnel = "shenron"
workers = ["shenron-cdn"]
buckets = ["shenron-cdn", "dbfr-backups"]

[project.rosegriffon]
repo = "aphrody-labs/rosegriffon"
zones = ["rosegriffon.fr"]
tunnel = ""
workers = ["rosegriffon-edge"]
buckets = ["rosegriffon-cdn"]

# auto.aphrody.com is the SaaS edition of open (apps/auto of the monorepo): its own tunnel to the USA host, no Worker or bucket yet.
[project.auto]
repo = "aphrody-labs/ay"
zones = []
tunnel = "auto"
workers = []
buckets = []
