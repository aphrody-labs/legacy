# prd relay wired to LiteLLM (127.0.0.1:4000, ay-ai-litellm unit): proxy master key read from
# systemd-creds, never in relay.env. relay.env keeps RELAY_OPENAI_ENDPOINTS=litellm=http://127.0.0.1:4000/v1
# and RELAY_ACP_MODEL=litellm/<route>/<model> (free routes first: tools/ai/litellm-overlay.toml).
# Installation : install -Dm644 10-litellm.conf ~/.config/systemd/user/aphrody-relay.service.d/10-litellm.conf
[Service]
# Copie à portée utilisateur (unité --user) : systemd-creds --user encrypt --name=LITELLM_MASTER_KEY - ~/.config/credstore.encrypted/LITELLM_MASTER_KEY
LoadCredentialEncrypted=LITELLM_MASTER_KEY
ExecStart=
ExecStart=/bin/sh -c 'RELAY_LITELLM_KEY="$(cat "$CREDENTIALS_DIRECTORY/LITELLM_MASTER_KEY")" exec %h/.bun/bin/bun "$SRC_ROOT"/frameworks/ai-os/src/relay/cli.ts serve'
