# gnu.aphrody.com on fr2: static site built by packages/gnu into /srv/gnu/site (index.html, app.js, feed.json, feed.atom).
# Reached through the fr2 Cloudflare tunnel (ingress gnu.aphrody.com -> http://127.0.0.1:80), no public origin port. Install: device/gnu/install.sh.
server {
    listen 80;
    listen [::]:80;
    server_name gnu.aphrody.com;
    root /srv/gnu/site;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    location = /feed.atom { default_type application/atom+xml; add_header Cache-Control "public, max-age=120"; }
    location = /feed.json { default_type application/json; add_header Cache-Control "public, max-age=120"; add_header Access-Control-Allow-Origin "*"; }
    location = /events.json { default_type application/json; add_header Cache-Control "public, max-age=120"; add_header Access-Control-Allow-Origin "*"; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "public, max-age=60"; }
}
