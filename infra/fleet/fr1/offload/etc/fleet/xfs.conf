# fleet-xfs.sh config of fr1 (docs/infra/SINGLE-SERVER.md stage 2). No free block device: sda root is ext4, sdb+sdc are the
# btrfs /home pool (647 GB used, 805 GB, cannot be shrunk to carve a volume without a full rebalance of live data).
# Interim: 40 GB sparse loop image on the SSD root, same paths as fr2. Replace by XFS_DEV=<device> when /home is retired.
XFS_MOUNT=/srv/xbuild
XFS_LABEL=build
XFS_IMG=/var/lib/fleet/xbuild.img
XFS_IMG_SIZE=40G
