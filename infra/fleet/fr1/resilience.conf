# fr1 (@@hosts.fr1.hostname@@): Chromium/LLVM builds only, preemptible. Read as /etc/fleet/resilience.conf.
HOST=fr1
SERVICES="nginx docker containerd aphrody-cluster-haproxy nativelink-server nativelink-worker fail2ban actions.runner.aphrody-dev-src.fr1.service"
TIMERS="fleet-health.timer fleet-fwd-standby@29401.socket fleet-fwd-standby@29402.socket src-checkout-update.timer fleet-notify.timer fleet-backup.timer chromium-factory.timer certbot.timer fleet-fwd-commons.socket fleet-fwd-gpu-depot.socket aphrody-agents-sync.timer"
WG="wg1"
LINGER="ubuntu agent"
USER_UNITS="agent:aphrody-agents.service agent:aphrody-agents-health.timer agent:aphrody-agents-pull.timer"
# Legacy yolo/bun-os stack (apps/auto/MIGRATION.md): sources gone (~/src/bun-os, ~/yolo-cluster, fr2:/srv/yolo_build_cache).
DISABLE="srv-yolo_build_cache.automount srv-yolo_build_cache.mount"
DISABLE_USER="ubuntu:@@hosts.fr2.hostname@@-auto-deliver.timer ubuntu:@@hosts.fr2.hostname@@-auto-deliver.path ubuntu:@@hosts.fr2.hostname@@-auto-guard.timer ubuntu:@@hosts.fr2.hostname@@-auto-health.timer ubuntu:@@hosts.fr2.hostname@@-auto-status.timer ubuntu:@@hosts.fr2.hostname@@-native-publish.path ubuntu:@@hosts.fr2.hostname@@-auto-deliver.service ubuntu:@@hosts.fr2.hostname@@-auto-guard.service ubuntu:@@hosts.fr2.hostname@@-auto-health.service ubuntu:@@hosts.fr2.hostname@@-auto-status.service"
NOFAIL="/home"
PROBES="nginx=http://127.0.0.1/ aphrody-cluster-haproxy=http://127.0.0.1:19900/stats"
BACKUP_RCLONE_USER=ubuntu
BACKUP_PATHS="/etc /var/lib/systemd/credential.secret /srv/chromium/factory/factory.toml /home/ubuntu/.config/systemd/user /home/ubuntu/.config/rclone /home/ubuntu/actions-runner/.runner /home/ubuntu/actions-runner/.credentials /home/ubuntu/actions-runner/.credentials_rsaparams"
BACKUP_SQLITE=""
FLEET_TCP="@@hosts.fr1.mesh_ip@@:50051 @@hosts.fr1.mesh_ip@@:50061 @@hosts.prd.mesh_ip@@:8766 @@hosts.prd.mesh_ip@@:8182"
HEAL_PEERS="fr2=ubuntu:root@@@hosts.fr2.public_ip@@ prd=ubuntu:root@@@hosts.prd.public_ip@@"
BATCH="fleet-backup"
# src checkout /srv/src, fast-forwarded every 5 min by src-checkout-update.sh (read-only source on prd and fr2).
SRC_CHECKOUT=/srv/src
SRC_SPARSE=""   # full tree (fleet-setup, 2026-11-13); third_party forks only on fr1 (third-party-sync.sh)
SRC_POST="ay manifests --check"
