# fleet-xfs.sh config of fr2 (docs/infra/SINGLE-SERVER.md stage 1). fr2 has one 100 GB disk, no spare device:
# proof volume = 4 GB sparse loop image on the ext4 root; replace XFS_IMG by XFS_DEV=<attached volume> when one exists.
XFS_MOUNT=/srv/xbuild
XFS_LABEL=build
XFS_IMG=/var/lib/fleet/xbuild.img
XFS_IMG_SIZE=4G
