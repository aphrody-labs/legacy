# Origin of open-origin.aphrody.com on prd: loopback plain HTTP, reached through the Cloudflare tunnel mig-prd
# (infra/cloudflare/cloudflare.toml ingress), same pattern as the standby origins in zz-fleet-standby.conf.
# Public 80/443 on prd belong to a container; no origin TLS is needed behind the tunnel. Brotli module is absent: gzip only.
server {
    listen 127.0.0.1:29403;
    server_name open-origin.aphrody.com;
    root /srv/open-www;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # hashed assets (name.<hex8+>.ext): immutable
    location ~* "\.[0-9a-f]{8,}\.(?:js|mjs|css|wasm|woff2?|png|jpe?g|webp|avif|svg|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
