# Pinned Android toolchain. Installed by `bun scripts/android-setup.ts` (just android-setup).
# Every pin was read on 2026-11-14 from the source named in `src`; `android.lock.json` holds the repository
# sha1 of each SDK archive (written by `bun scripts/android-setup.ts lock`). Profiles: pc, ci (fr1/fr2).
# ay up (tools.toml) cannot express SDK packages, hence this separate manifest.

[meta]
sdk_xml = "https://dl.google.com/android/repository/repository2-3.xml"
sysimg_xml = ["https://dl.google.com/android/repository/sys-img/google_apis/sys-img2-3.xml", "https://dl.google.com/android/repository/sys-img/android/sys-img2-3.xml", "https://dl.google.com/android/repository/sys-img/google_atd/sys-img2-3.xml"]
# Linux SDK root on fr1/fr2; the PC uses %LOCALAPPDATA%\Android\Sdk. ANDROID_HOME overrides.
sdk_root_linux = "~/Android/Sdk"
sdk_root_windows = "~/AppData/Local/Android/Sdk"
tools_dir = "~/.local/share/ay/android"
ndk_api = 29                      # minSdk used by x86_64-linux-android<API>-clang
emulator_api_image = "system-images;android-37.2;google_apis_ps16k;x86_64"
avd_name = "ay-x64"

# ---- JDK (src: https://api.adoptium.net/v3/info/available_releases 2026-11-14: LTS 25, latest feature 27) ----
[[jdk]]
name = "temurin-25-lts"
version = "25.0.5+8"
profiles = ["pc", "ci"", "emu"]
linux = { url = "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz", sha256 = "68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb" }
