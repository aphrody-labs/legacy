# Craft Apps: one entry per app. Sources are the pins `third_party/<repo>` of src.lock.json (aphrody-labs forks of storytold/<repo>),
# built from upstream by `craft build`; nothing is copied into this tree. `package` is the native app, `cli` its command-line sibling.
[app.photocraft]
repo = "photocraft"
package = "photocraft"
cli = "photocraft-cli"

