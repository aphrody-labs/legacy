<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#056b5b" />
    <!-- Installable app: links added at load time (served by the server, not by the bundler). -->
    <script>
      for (const [rel, href] of [
        ["manifest", "/manifest.webmanifest"],
        ["apple-touch-icon", "/icones/180.png"],
      ])
        document.head.append(Object.assign(document.createElement("link"), { rel, href }));
    </script>
    <!-- Stored theme applied before first paint (no flash): data-theme for the tokens, .dark/.light for Tailwind. -->
    <script>
      try {
        const t = localStorage.getItem("auto-theme");
        if (t === "clair" || t === "sombre") {
          document.documentElement.dataset.theme = t;
          document.documentElement.classList.add(t === "sombre" ? "dark" : "light");
        }
      } catch {}
    </script>
    <meta name="description" content="%%home.meta.description%%" />
    <meta property="og:title" content="%%home.meta.title%%" />
    <meta property="og:description" content="%%home.meta.og_description%%" />
    <title>%%home.meta.title%%</title>
    <link rel="canonical" href="https://auto.aphrody.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="auto" />
    <meta property="og:locale" content="%%og:locale%%" />
    <meta property="og:url" content="https://auto.aphrody.com/" />
    <meta property="og:image" content="https://auto.aphrody.com/img/og-auto.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="629" />
    <meta property="og:image:alt" content="%%home.meta.og_alt%%" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="../src/styles/accueil.css" />
    <!-- Faces visible on the first screen (title and body, latin): hashed URLs checked by serveur.test.ts. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/polices/plus-jakarta-sans-latin-700-normal-2050755bf4.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/polices/inter-latin-400-normal-8909904ab6.woff2"
    />
    <!-- Hero background (LCP element) discovered before the React render: same srcset as site/medias.tsx (serveur.test.ts). -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="/img/v/btp-plan-768-139c24c163.avif 768w, /img/v/btp-plan-1536-33f2c3b4b1.avif 1536w"
      imagesizes="100vw"
    />
  </head>
  <body>
    <div id="racine">
      <noscript>
        <p style="padding: 2rem; font-family: system-ui, sans-serif">
          %%home.noscript.text%%
          <a href="/app/inscription">%%home.noscript.link%%</a>.
        </p>
      </noscript>
    </div>
    <script type="module" src="../src/site/accueil-client.tsx"></script>
  </body>
</html>
