<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#056b5b" />
    <!-- Installable app: links added at load time (served by the server, not by the bundler). -->
    <script>
      for (const [rel, href] of [
        ["manifest", "/manifest.webmanifest"],
        ["apple-touch-icon", "/icones/180.png"],
      ])
        document.head.append(Object.assign(document.createElement("link"), { rel, href }));
    </script>
    <!-- Stored theme applied before first render (no flash); the rest of the logic loads afterwards. -->
    <script>
      try {
        const t = localStorage.getItem("auto-theme");
        if (t === "clair" || t === "sombre") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <meta name="robots" content="noindex" />
    <title>auto</title>
    <link rel="stylesheet" href="../src/styles/app.css" />
    <link rel="stylesheet" href="../src/styles/responsive.css" />
    <!-- Body text (Inter 400, latin): hashed URL checked by serveur.test.ts. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/polices/inter-latin-400-normal-8909904ab6.woff2"
    />
  </head>
  <body>
    <div id="racine"></div>
    <noscript>%%app.noscript%%</noscript>
    <script type="module" src="../src/client/main.tsx"></script>
  </body>
</html>
