name: Bug
description: Incorrect behavior
labels: [bug]
body:
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: What happens, with the exact error message.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps, anonymized data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Invoicing, Factur-X / PA, Mail, Office files, Video, Employees, Agents / RAG, API, Other]
    validations:
      required: true
