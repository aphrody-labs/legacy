# nt Rust samples on the windows-rs WinUI stack (windows-reactor: declarative WinUI 3, Windows App SDK 2.x).
# The nt Rust core lives in the windows-rs monorepo (aphrody-labs fork, master); only samples here.
[workspace]
resolver = "3"
members = ["brand", "winui-hello"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# aphrody-labs/windows-rs fork pinned by commit (= microsoft/windows-rs master 8ca69fda of 2026-11-11):
# windows-reactor 0.101.0, not published on crates.io (0.100.0). Git dependency, never a local path.
windows-reactor = { git = "https://github.com/aphrody-labs/windows-rs", rev = "8ca69fdaa9d69c78b9bcfbee96c6916f2282e7f0" }
