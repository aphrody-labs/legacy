[package]
publish = false
repository.workspace = true
description = "Lore version control: lore-integration-tests (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-integration-tests"
version = "0.1.0"
edition = "2024"
# One target for the whole suite, declared below. Autodiscovery would compile
# every file in tests/ as a test binary of its own, and each is a module of that
# suite rather than a crate root.
autotests = false

# The suite runs against the services in compose.yaml, so every test in it is
# behind `integration_tests`. Naming the feature here keeps a build that does not
# enable it from linking the target at all, rather than linking a harness that
# holds no tests.
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration_tests"]

# Its own target rather than a module of the suite: it installs a process-wide GC event sink
# provider, which takes the first registration and would otherwise race the suite's own.
# Needs no service from compose.yaml, so it is not behind `integration_tests`.
[[test]]
name = "store_gc_trigger"
path = "tests/store_gc_trigger_test.rs"

# Its own target: whether a process retains its stores is read once per process, so each test
# runs in a copy of this binary started with `LORE_STORE_RETAIN` set or removed. Needs no service
# from compose.yaml, so it is not behind `integration_tests`.
[[test]]
name = "store_retention"
path = "tests/store_retention_test.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
aws-sdk-dynamodb = { workspace = true, features = ["rt-tokio"] }
aws-sdk-s3 = { workspace = true, features = ["rt-tokio"] }
bytes = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde_json = { workspace = true }
rs-consul = { workspace = true }
rustls = { workspace = true, optional = true }
serde_dynamo = { workspace = true, features = ["aws-sdk-dynamodb+1"] }
tokio = { workspace = true }
tokio-stream = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zerocopy = { workspace = true }
lore = { workspace = true }
lore-base = { workspace = true }
lore-storage = { workspace = true }
lore-aws = { workspace = true }
lore-revision = { workspace = true }
lore-hashicorp = { workspace = true }
lore-proto = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
ctor = { workspace = true }
lore = { path = "../../src/lore", package = "aphrody-lore", features = ["test-util"] }
lore-base = { path = "../../src/lore/base", package = "aphrody-lore-base", features = [
  "test-util",
] }
lore-server = { path = "../../src/lore/server", package = "aphrody-lore-server" }
lore-storage = { path = "../../src/lore/storage", package = "aphrody-lore-storage", features = ["test-util"] }
# Here rather than under [dependencies]: a normal dependency's features apply to every build that
# includes this package, so a release build of the workspace would compile lore-revision's test
# access into every binary.
lore-revision = { path = "../../src/lore/revision", package = "aphrody-lore-revision", features = ["test-util"] }
lore-transport = { path = "../../src/lore/transport", package = "aphrody-lore-transport", features = ["test-util"] }
rcgen = { workspace = true }
serde = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = { workspace = true }
lore-fuse = { path = "../../src/lore/fuse", features = ["test-util"], package = "aphrody-lore-fuse" }

[features]
integration_tests = ["lore-server/integration_tests"]
grpc_integration_tests = ["dep:tokio-stream", "dep:tonic"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
# lore-server's telemetry reads cfg(tokio_unstable). Declared here because a crate cannot
# have its own lints table alongside `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 } # TODO(raghav.narula) Enable after duplicate dependencies fixed
# undocumented_unsafe_blocks = "warn" # TODO(raghav.narula) enable in follow up
checked_conversions = "warn"
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
