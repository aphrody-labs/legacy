[package]
repository.workspace = true
description = "Lore version control: lore-io (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-io"
edition = "2024"
version = "0.13.1-nightly"

[lib]
name = "lore_io"
test = false

[dependencies]
bytes = { workspace = true }
lore-macro = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true }

# For the uring backend's eventfd and poll, the thread disk priority, the error codes that tell
# a mount point, and the clone backends' `clonefile`, `fcopyfile`, `FICLONE`, `statfs` and `statvfs`.
[target.'cfg(target_family = "unix")'.dependencies]
libc = { workspace = true }

# Windows only, and load-bearing rather than convenience: handles opened here are overlapped, so
# that concurrent operations on one of them are not serialized by the I/O manager, and `std` has no
# positional call that is defined against such a handle. The data path issues `ReadFile`/`WriteFile`
# with its own `OVERLAPPED` instead. windows-sys is the workspace's Win32 binding already.
[target.'cfg(target_family = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  # `CreateEventW` takes a `SECURITY_ATTRIBUTES`, so its module is only compiled with this. The
  # crate built without it while the workspace happened to enable it elsewhere; naming it here is
  # what makes `cargo build -p lore-io` stand on its own.
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  # `FSCTL_DUPLICATE_EXTENTS_TO_FILE` and the integrity and sparse controls the ReFS clone
  # backend issues with it, and the reparse-point controls the clone copies a link or
  # junction with.
  "Win32_System_Ioctl",
  # For IO_REPARSE_TAG_MOUNT_POINT, which tells a directory that a rename would move without
  # the files it leads to.
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  # For FILE_SKIP_COMPLETION_PORT_ON_SUCCESS and FILE_SKIP_SET_EVENT_ON_HANDLE, which the
  # completion-port backend needs to own a synchronous completion rather than race the reaper
  # for it.
  "Win32_System_WindowsProgramming",
] }

# The library depends on no async runtime: its futures suspend on wakers alone. tokio is here for
# the tests' own runtime, and futures drives the case that proves the point without one. lore-base
# is here for its `#[global_allocator]`: the read path's design rests on the process allocator
# caching spans per thread, so a benchmark on glibc malloc measures a different program than the
# one that ships. lore-io itself is here with `test-util`, which opens its internals to the unit
# tests in tests/unit. Dev-only, so the library's own dependency graph is unchanged.
[dev-dependencies]
futures = { workspace = true }
lore-base = { path = "../base", package = "aphrody-lore-base", features = [
  "test-util",
] }
lore-io = { path = ".", package = "aphrody-lore-io", features = ["test-util"] }
tokio = { workspace = true }

# A named pipe is the only thing a unit test can make defer on demand, and deferring is the whole
# of what the completion-port backend is for. See `overlapped_pipe_pair` in tests/unit/iocp.rs. The
# conformance suite names `ERROR_SHARING_VIOLATION` and `FILE_SHARE_READ` when it pins the share
# modes, hence the foundation and filesystem modules here as well. The listing tests name the
# reparse tags of a symbolic link, a junction and a deduplicated file, which the
# `Win32_System_SystemServices` module holds.
[target.'cfg(target_family = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_SystemServices",
] }

[features]
test-util = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
# lore-server's telemetry reads cfg(tokio_unstable). Declared here because a crate cannot
# have its own lints table alongside `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 } # TODO(raghav.narula) Enable after duplicate dependencies fixed
# undocumented_unsafe_blocks = "warn" # TODO(raghav.narula) enable in follow up
checked_conversions = "warn"
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
