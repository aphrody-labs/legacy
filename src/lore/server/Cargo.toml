[package]
repository.workspace = true
description = "Lore version control: lore-server (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-server"
edition = "2024"
version = "0.13.1-nightly"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
async-stream = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
config = { workspace = true }
dashmap = { workspace = true }
enum_dispatch = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
hyper = { workspace = true, features = ["server", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
jsonwebtoken = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
parking_lot = { workspace = true }
pin-project = { workspace = true }
prost-types = { workspace = true }
quinn = { workspace = true }
quinn-proto = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
smallvec = { workspace = true }
socket2 = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-metrics = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["timeout", "trace"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-ecs = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
lore-base = { workspace = true }
lore-aws = { workspace = true }
lore-hashicorp = { workspace = true }
lore-storage = { workspace = true }
lore-revision = { workspace = true }
lore-transport = { workspace = true }
lore-error-set = { workspace = true }
lore-macro = { workspace = true }
lore-notification = { workspace = true }
lore-proto = { workspace = true }
lore-telemetry = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }
zerocopy = { workspace = true }
# Stands in for the replication client in this crate's own tests, behind `test-util`.
mockall = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
# The unit-test binary's store policies, set before the harness starts; see tests/unit/main.rs.
ctor = { workspace = true }
lore-base = { path = "../base", package = "aphrody-lore-base", features = [
  "test-util",
] }
lore-credential = { path = "../credential", package = "aphrody-lore-credential" }
lore-storage = { path = "../storage", package = "aphrody-lore-storage", features = ["test-util"] }
axum-test = { workspace = true }
rcgen = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
indexmap = { workspace = true }
mockall = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
temp-env = { workspace = true }
# `start_paused` for the tests that time push phases on a virtual clock.
tokio = { workspace = true, features = ["test-util"] }
lore-server = { path = ".", package = "aphrody-lore-server", features = [
  "test-util",
] }
# The points where a test stops a branch write, to leave a restore stopped part way.
lore-revision = { path = "../revision", package = "aphrody-lore-revision", features = ["test-util"] }

[features]
default = []
test-util = ["dep:mockall"]
oodle = ["lore-revision/oodle"]
integration_tests = []
test_random = []
seeding = ["lore-revision/seeding"]
# Enables fault-injection in the storage layer (e.g. LORE_MISS_FRAGMENT_WRITES).
# Used by smoke tests that exercise missing-fragment recovery paths.
failure_generator = ["lore-storage/failure_generator"]
# Builds the `uds-bench` example, which the container tests drive.
uds-bench = []

[[bin]]
name = "loreserver"
# The binary holds no unit tests; the library it drives does.
test = false

[[example]]
name = "uds-bench"
path = "examples/uds_bench.rs"
required-features = ["uds-bench"]

[lib]
name = "lore_server"
test = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
# lore-server's telemetry reads cfg(tokio_unstable). Declared here because a crate cannot
# have its own lints table alongside `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 } # TODO(raghav.narula) Enable after duplicate dependencies fixed
# undocumented_unsafe_blocks = "warn" # TODO(raghav.narula) enable in follow up
checked_conversions = "warn"
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
