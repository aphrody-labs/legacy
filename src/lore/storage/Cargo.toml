[package]
repository.workspace = true
description = "Lore version control: lore-storage (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-storage"
edition = "2024"
version = "0.13.1-nightly"

[lib]
name = "lore_storage"
test = false

[dependencies]
async-trait = { workspace = true }
bitcode = { workspace = true }
bitflags = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
crossbeam-queue = { workspace = true }
dashmap = { workspace = true }
fastcdc = { workspace = true }
futures = { workspace = true }
lore-base = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
lore-io = { workspace = true }
lore-macro = { workspace = true }
lore-transport = { workspace = true }
lz4-sys = { workspace = true }
zstd-sys = { workspace = true }
opentelemetry = { workspace = true }
parking_lot = { workspace = true }
pin-project = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
lore-error-set = { workspace = true }
lore-telemetry = { workspace = true }
uuid = { workspace = true, features = ["zerocopy"] }
xxhash-rust = { workspace = true }
zerocopy = { workspace = true }

[features]
default = []
failure_generator = []
oodle = []
store-stress = []
test-util = []
trace_log = []

# The stress harness, run by hand through `scripts/store-stress/stress.py`, which enables
# `store-stress`. Naming the feature here keeps `cargo test` and builds of all targets from
# building it at all: it builds on Unix only, and is not part of any test run.
[[example]]
name = "store_stress"
path = "examples/store_stress/main.rs"
required-features = ["store-stress"]

[dev-dependencies]
# The shared test temp-directory helper.
lore-base = { path = "../base", package = "aphrody-lore-base", features = [
  "test-util",
] }
lore-storage = { path = ".", package = "aphrody-lore-storage", features = [
  "test-util",
] }
# A session over a stub peer, with no live connection behind it.
lore-transport = { path = "../transport", package = "aphrody-lore-transport", features = ["test-util"] }
# A paused clock, so retry back-off takes no real time.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_family = "windows")'.dependencies]
# `Win32_Storage_FileSystem` does not imply `Win32_Foundation`, and the packstore reads its error
# constants from the latter, so both are named here rather than relying on another crate in the
# build enabling it.
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
# lore-server's telemetry reads cfg(tokio_unstable). Declared here because a crate cannot
# have its own lints table alongside `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 } # TODO(raghav.narula) Enable after duplicate dependencies fixed
# undocumented_unsafe_blocks = "warn" # TODO(raghav.narula) enable in follow up
checked_conversions = "warn"
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
