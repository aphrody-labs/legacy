[package]
edition = "2024"
rust-version = "1.97"
name = "aphrody-gpu-backend"
version = "1.4.7"
authors = ["aphrody-code"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Shared wgpu instance, adapter, device and surface-configuration boundary for Aphrody and IECODE renderers, plus the process-wide GPU hub (wgpu + CUDA)."
readme = false
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/aphrody"

[features]
cuda = [
    "hub",
    "dep:cudarc",
]
default = [
    "wgsl",
    "native-backends",
]
hub = [
    "wgsl",
    "native-backends",
    "dep:pollster",
    "dep:serde",
    "dep:serde_json",
]
native-backends = [
    "wgpu/vulkan",
    "wgpu/dx12",
    "wgpu/metal",
]
vkwebgpu = [
    "dep:naga",
    "naga/spv-in",
    "naga/wgsl-out",
]
vkwebgpu-wasm = [
    "vkwebgpu",
    "dep:js-sys",
    "dep:wasm-bindgen",
]
webgl = [
    "wgpu/web",
    "wgpu/webgl",
]
webgpu = [
    "wgpu/web",
    "wgpu/webgpu",
]
wgsl = ["wgpu/wgsl"]

[lib]
name = "aphrody_gpu_backend"
crate-type = [
    "rlib",
    "cdylib",
]
path = "src/lib.rs"

[[test]]
name = "hub"
path = "tests/hub.rs"

[dependencies.cudarc]
version = "0.19.10"
features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-13040",
]
optional = true
default-features = false

[dependencies.naga]
version = "30.0.1"
optional = true
default-features = false

[dependencies.pollster]
version = "1.0.1"
optional = true

[dependencies.serde]
version = "1.0.228"
features = [
    "derive",
    "std",
]
optional = true
default-features = false

[dependencies.serde_json]
version = "1.0.151"
optional = true

[dependencies.wgpu]
version = "30.0.1"
features = ["std"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3.104"
optional = true
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2.127"
optional = true
default-features = false

