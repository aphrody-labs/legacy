[package]
name = "aphrody-ghidra-bun"
version = "0.1.0"
edition = "2021"
description = "Native Bun plugin (onBeforeParse, NAPI cdylib) and fast-path analysis for @aphrody/ghidra, backed by aphrody-re"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: the repo root Cargo.toml must list this crate as a member
# when it is promoted ("src/ghidra-bun"); until then this table stops cargo's upward search.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# full Ghidra decompiler (ghidra-decompiler 2.1.0) through aphrody-re
decompile = ["aphrody-re/decompile"]

[dependencies]
aphrody-re = { path = "../re", default-features = false }
bun-native-plugin = "0.2.0"
napi = { version = "3.16.2", default-features = false, features = ["napi4"] }
napi-derive = "3.7.1"
serde_json = "1"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
