[package]
publish = false
name = "aphrody"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ay: one multicall CLI for the Aphrody monorepo (arch gate, lock, git, ingest, graph, deploy, bench, build)"
repository = "https://github.com/aphrody-labs/aphrody"

# Released with dist (dist-workspace.toml); the only dist package in the workspace.
[package.metadata.dist]
dist = true

[[bin]]
name = "ay"
path = "src/main.rs"

[lib]
name = "ay"
path = "src/lib.rs"
# No doctests in ay; rustdoc does not see the build-script rlib of aphrody-docs (fr1, 2026-11-13).
doctest = false

[features]
# Magika (ONNX Runtime) as the detector of `ay index --sniff` for files that extension and magic bytes cannot place.
default = ["magika"]
magika = ["aphrody-re/magika"]

[dependencies]
archguard.workspace = true
aphrody-conformance = { version = "0.4.0", path = "../../test/conformance" }
aphrody-re = { workspace = true, features = ["index"] }
# `ay index`: the in-process index pipeline (src/core/src/pipeline) and its file watcher.
aphrody-core = { workspace = true, features = ["pipeline"] }
notify = "9.0.0-rc.8"
clap.workspace = true
depot-cli.workspace = true
depot-cipd.workspace = true
depot-core.workspace = true
depot-gclient = { version = "0.4.0", path = "../depot/gclient" }
depot-vpython = { version = "0.4.0", path = "../depot/vpython" }
remote = { version = "0.4.0", package = "aphrody-remote", path = "../remote" }
serde_json.workspace = true
# `ay ai`: ai.toml, provider HTTP checks, secrets from `.env`.
serde.workspace = true
toml.workspace = true
ureq.workspace = true
regex.workspace = true
# `ay code`: parser-backed refs/mv/stage.
tree-sitter.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
uuid.workspace = true
dotenvy = { workspace = true }
sys = { version = "0.4.0", path = "../machine", package = "aphrody-machine" }
xtk.workspace = true
up = { version = "0.4.0", package = "aphrody-up", path = "../up" }
rt = { version = "0.4.0", package = "aphrody-rt", path = "../rt" }
# `ay sh`: the embedded Bash 5.3 engine (src/rubash), linked through its Session API.
rubash = { version = "1.5.0", path = "../rubash" }
# `ay applet`: applets ported from WinuxCmd C++ to portable Rust, in process on every host.
winux-core = { version = "0.1.0", path = "../winux/core" }
winux-extra = { version = "0.1.0", path = "../winux/extra" }
# `ay docs` (Bun docs index) and `ay flat` / `ay hash` / `ay time` (bun fork crates, flattened).
aphrody-docs = { version = "0.4.0", path = "../docs" }
aphrody-omarchy = { version = "0.4.0", path = "../posix/omarchy" }
aphrody-ui = { version = "0.4.0", path = "../ui/kit", default-features = false, features = ["std", "serde", "fusion", "dioxus", "anyrender", "tui", "editor"] }
# Bun crates used by `ay hash` / `ay time` (src/ay/src/low/flat.rs).
bun_wyhash.workspace = true
bun_histogram.workspace = true
# `ay electron`: analyze / migrate (Tauri, GPUI) / optimize / bench Electron apps.
electron_migrate = { version = "0.4.0", package = "aphrody-electron-migrate", path = "../electron-migrate" }
# `ay steam`: Steam data as JSON (VDF, appinfo, manifests, compat tools, Proton env).
bun-steam = { version = "1.4.8", package = "steam-depot", path = "../steam" }
# `ay self-update` against the dist releases (blocking API, no async runtime in ay itself).
axoupdater = { workspace = true, features = ["blocking"] }

# The benchmark suite measures Win32 APIs; `ay bench` reports unsupported elsewhere.
[target.'cfg(windows)'.dependencies]
stack-bench.workspace = true
# `ay applet`: the WinuxCmd Rust applets (src/winux), Win32 implementations, linked on Windows only.
winux-cmds = { version = "0.1.0", path = "../winux/cmds" }

# Brand icon and version resource of ay.exe (build.rs, ay.ico from packages/design/brand).
[build-dependencies]
winresource = "0.1.34"
