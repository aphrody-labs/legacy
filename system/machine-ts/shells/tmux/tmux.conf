# Official tmux 3.6 configuration (24-bit RGB truecolor, mouse, vi copy-mode, Catppuccin Mocha)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
setw -g mode-keys vi

unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Status bar (Catppuccin Mocha / Nerd Font v3)
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold]  #S #[fg=#89b4fa,bg=#181825] "
set -g status-right "#[fg=#313244,bg=#181825]#[fg=#94e2d5,bg=#313244] %Y-%m-%d  %H:%M #[fg=#89b4fa,bg=#313244]#[fg=#11111b,bg=#89b4fa,bold] #H "
setw -g window-status-format "#[fg=#a6adc8,bg=#181825] #I:#W "
setw -g window-status-current-format "#[fg=#181825,bg=#313244]#[fg=#89b4fa,bg=#313244,bold] #I:#W #[fg=#313244,bg=#181825]"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
