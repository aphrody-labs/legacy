# Official Starship v1.27.0 configuration (Nerd Fonts v3 + Catppuccin Mocha palette)
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 350
scan_timeout = 10
palette = "catppuccin_mocha"

format = """
[](surface0)\
$os\
$username\
[](bg:peach fg:surface0)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$bun\
$nodejs\
$python\
$dotnet\
[](fg:green bg:blue)\
$cmd_duration\
[ ](fg:blue)\
$line_break\
$character"""

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Windows = " "
Ubuntu = " "
Debian = " "
Arch = " "
Linux = " "
Macos = " "

[username]
show_always = false
style_user = "bg:surface0 fg:subtext1"
style_root = "bg:red fg:crust"
format = "[$user]($style)"

[directory]
style = "bg:peach fg:crust bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"C:/aphrody" = "󰚝 src"
"C:\\aphrody" = "󰚝 src"
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:yellow fg:crust bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:yellow fg:crust"
format = "[$all_status$ahead_behind]($style)"

[c]
symbol = " "
style = "bg:green fg:crust"
format = "[ $symbol($version) ]($style)"

[rust]
symbol = ""
style = "bg:green fg:crust"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:green fg:crust"
format = "[ $symbol $version ]($style)"

[bun]
symbol = ""
style = "bg:green fg:crust"
format = "[ $symbol $version ]($style)"

[nodejs]
symbol = ""
style = "bg:green fg:crust"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "bg:green fg:crust"
format = "[ $symbol $version ]($style)"

[dotnet]
symbol = ""
style = "bg:green fg:crust"
format = "[ $symbol $version ]($style)"

[cmd_duration]
min_time = 800
style = "bg:blue fg:crust bold"
format = "[ 󱎫 $duration ]($style)"

[character]
success_symbol = "[❯](bold sapphire)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
