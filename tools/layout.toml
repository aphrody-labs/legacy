# Target layout: source of the table in docs/project/layout.md and of `bun scripts/relayout.ts`.
# `[[area]]` rows describe a top-level directory; `[[move]]` rows are applied once by `bun scripts/relayout.ts apply`
# (directory rename, then every textual reference to `from` is rewritten to `to`). `check` fails while a `from` path
# still exists or is still referenced.

[[area]]
dir = "apps"
role = "end-user applications (web, auto, nt, craft, game, ...)"
why = "AOSP packages/apps and Chromium chrome/: products stay apart from the platform"

[[area]]
dir = "build"
role = "CI, container images, package recipes, SDK pins, Chromium factory"
why = "AOSP build/ and Chromium build/: how the tree is built"

[[area]]
dir = "device"
role = "targets and fleet: hosts, cluster, OS images, cloud, secrets, deploy"
why = "AOSP device/: per-target configuration"

[[area]]
dir = "docs"
role = "documentation, generated index"
why = "Chromium docs/"

[[area]]
dir = "frameworks"
role = "AI OS frameworks: ai-os, Google services, a2a, inference, media, UI backends (Bun packages; crates follow in batch 4)"
why = "AOSP frameworks/: the services applications are built on"

[[area]]
dir = "system"
role = "ay, the Bun fork core, shell, userland, compat (nt, wine, posix) (Bun packages; crates follow in batch 5)"
why = "AOSP system/: the core userland"

[[area]]
dir = "prebuilts"
role = "binary pins installed by ay up"
why = "AOSP prebuilts/: binaries are pinned, not built here"

[[area]]
dir = "scripts"
role = "gates and generators run by CI and just"
why = "Bun and Chromium both keep scripts/ and tools/ at the root"

[[area]]
dir = "src"
role = "Rust crates (oven-sh/bun layout), C core, assembly, WebAssembly"
why = "kept: crates taken from oven-sh/bun main (Cargo.toml header), so the paths stay the upstream paths; moving it needs a CI-verified pass of its own"

[[area]]
dir = "test"
role = "workspace tests and conformance"
why = "Bun test/"

[[area]]
dir = "third_party"
role = "upstream checkouts (linux, chromium) and pins"
why = "Chromium third_party/; AOSP external/"

[[area]]
dir = "tools"
role = "agent tooling, upstream machinery, identity, generators"
why = "AOSP tools/ and Chromium tools/"

