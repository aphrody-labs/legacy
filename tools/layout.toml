# Batch 2: Bun packages. A name that exists as a crate in src/ keeps the crate name there and gets the suffix -ts here.
[[group]]
batch = 2
from = "packages"
to = "frameworks"
names = ["ai-os", "api", "assets", "automate", "bun-video", "canvas", "chromium", "design", "discord-kit", "gaming", "google", "i18n", "m3-ai", "m3-os-themes", "m3-primitives", "m3-reader", "m3-theme", "m3-tokens", "messaging", "plugin-opener", "re", "web", "web-crawl"]
rename = { chromium = "chromium-ts", google = "google-ts", i18n = "i18n-ts", re = "re-ts" }

[[group]]
batch = 2
from = "packages"
to = "system"
names = ["bun-parity", "bun-plugin-tailwind", "bun-plugins", "bun-runtime-sdk", "bun-sql", "bun-steam", "bun-test-dom", "bun-usockets", "bunify", "core", "core-java", "core-py", "deploy", "env-kit", "ffi-bridge", "forge", "gnu", "http", "machine", "native", "next-bun", "omniu", "py2bun", "release", "sql", "third_party", "upstream", "wck", "x"]
rename = { core = "core-ts", gnu = "gnu-ts", http = "http-ts", machine = "machine-ts", py2bun = "py2bun-ts", sql = "sql-ts" }

# Batch 3: the C core and its drivers. src/kernel becomes kernel/core (kernel/kernel would repeat itself).
[[move]]
batch = 3
from = "src/arch"
to = "kernel/arch"

[[move]]
batch = 3
from = "src/kernel"
to = "kernel/core"

[[move]]
batch = 3
from = "src/include"
to = "kernel/include"

[[move]]
batch = 3
from = "src/wasm"
to = "kernel/wasm"

[[move]]
batch = 3
from = "src/tests"
to = "kernel/tests"

[[move]]
batch = 3
from = "src/Makefile"
to = "kernel/Makefile"

[[move]]
batch = 3
from = "src/.clang-format"
to = "kernel/.clang-format"

[[move]]
batch = 3
from = "src/.clang-tidy"
to = "kernel/.clang-tidy"

[[move]]
batch = 3
from = "src/drivers"
to = "hardware/drivers"

# Batch 4: AI, agent, media, UI and game crates move to frameworks/. Batch 5: the remaining crates (Bun fork core, shell, userland, compat) move to system/.
[[group]]
batch = 4
from = "src"
to = "frameworks"
names = ["a2a", "a2a-client", "a2a-coord", "a2a-grpc", "a2a-pb", "a2a-server", "accounts", "agent", "agent-home", "agent-proto", "agent-runtime", "agent-tools", "analytics", "antigravity", "audio", "boq", "bun-video-native", "craft", "chromium", "corelib", "embed", "emu", "flowcat-agent", "flowcat-cli", "flowcat-core", "flowcat-server", "flowcat-services", "flowcat-telephony", "flowcat-transports", "game", "gateway", "gemini-runtime", "gemini-super-tauri", "gemini-web", "google", "i18n", "infer", "lore", "llama", "llama-server", "llama-sys", "mcp-client", "memory", "ml-config", "ml-runtime", "model-antigravity", "model-client", "modele", "models", "ocr", "ocr-core", "openpets-core", "rag", "rag-core", "re", "ring3-agent", "safety", "steam", "taffy", "tao", "tao-macros", "tv", "ui", "tauri-build", "tauri-bundler", "tauri-cli-node", "tauri-cli", "tauri-codegen", "tauri-driver", "tauri-examples", "tauri-macos-sign", "tauri-macros", "tauri-plugin-autostart", "tauri-plugin-barcode-scanner", "tauri-plugin-biometric", "tauri-plugin-cli", "tauri-plugin-clipboard-manager", "tauri-plugin-deep-link", "tauri-plugin-dialog", "tauri-plugin-fs", "tauri-plugin-geolocation", "tauri-plugin-global-shortcut", "tauri-plugin-haptics", "tauri-plugin-http", "tauri-plugin-localhost", "tauri-plugin-log", "tauri-plugin-nfc", "tauri-plugin-notification", "tauri-plugin-opener", "tauri-plugin-os", "tauri-plugin-persisted-scope", "tauri-plugin-positioner", "tauri-plugin-process", "tauri-plugin-shell", "tauri-plugin-single-instance", "tauri-plugin-sql", "tauri-plugin-store", "tauri-plugin-stronghold", "tauri-plugin-updater", "tauri-plugin-upload", "tauri-plugin-websocket", "tauri-plugin-window-state", "tauri-plugin", "tauri-runtime-cef", "tauri-runtime-wry", "tauri-runtime", "tauri-schema-generator", "tauri-schema-worker", "tauri-utils", "tauri"]

