# Single source of the product identity. Renaming = edit this file, `just identity apply`, `just check`.
# Gate: `just identity check` (in `just check` and CI). Readers: scripts/identity.ts (apply/check of the manifests),
# system/xtask (DEPS vars), packages via `import identity from "<root>/tools/identity.toml"` (Bun TOML import).
# The repository root is the nearest ancestor holding tools/identity.toml (this file: no marker name carries the product or the
# checkout folder name), else $REPO_ROOT. Checkout paths are never written in sources: derive them from the root.

[product]
name = "aphrody"
display = "Aphrody Labs"
repo = "ay"
repo_org = "lab" # key of [orgs] owning the repository: github.com/aphrody-labs/ay (renamed 2026-11-14)

[cli]
binary = "ay" # [[bin]] of system/ay
crate = "aphrody" # package name of system/ay

[naming]
npm_scope = "@aphrody" # every package.json#name under system/ and frameworks/ and the root package
crate_prefix = "aphrody-" # a crate under system/ or frameworks/ is named <dir> or <crate_prefix><dir> (crates.io collisions, docs/project/naming.md)

# Prefixes follow the name: C symbols `<name>_`, environment `<NAME>_`; override with [naming] c_prefix and env_prefix.
# `just identity apply` rewrites the old identity (HEAD:tools/identity.toml) literals to the new one: npm scope, crate prefix,
# C and env prefixes, product name, binary calls. Upstream namespaces (win32, ffmpeg, Linux, Chromium, upstream env) never change.

# Historical names kept as-is (renaming them is a breaking change for their users).
[naming.crate_names]
bench = "stack-bench"
xtask = "xtk"
unix-omarchy = "aphrody-omarchy"

[orgs]
main = "aphrody-dev" # main org (published packages, forks of upstream tools)
lab = "aphrody-labs" # forks and products (apps/*)

[domains]
root = "aphrody.com"
home = "labs.aphrody.com"
git = "git.aphrody.com"
contact = "contact@aphrody.com"

# Sub-products with their own binary; their npm name is <npm_scope>/<binary>.
[products.ai-os]
binary = "ai-os"
path = "frameworks/ai-os"
home_env = "AGENT_HOME"
home_default = "~/.agent"

# Public channels of the anonymous identity (docs/infra/IDENTITY.md): nothing personal (name, private mailbox, phone, photo).
# Private mailboxes are vault keys only (APHRODY_OWNER_GOOGLE_ACCOUNT, APHRODY_AI_GOOGLE_ACCOUNT).
[contact]
email = "contact@aphrody.com"
security = "security@aphrody.com"
noreply = "noreply@aphrody.com"
page = "https://aphrody.com/#contact"
github = ["aphrody-dev", "aphrody-labs"]
git_email = "324927936+aphrody-dev@users.noreply.github.com" # commit identity on the PC and the fleet
x = "" # handle not claimed yet (draft: var/agents/publish/x-profile.md)
discord = "" # invite not created yet (draft: var/agents/publish/discord-profile.md)
