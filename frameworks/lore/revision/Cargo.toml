[package]
repository.workspace = true
description = "Lore version control: lore-revision (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-revision"
edition = "2024"
version = "0.13.1-nightly"

[lib]
name = "lore_revision"
test = false

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bitcode = { workspace = true }
blake3 = { workspace = true }
bitflags = { workspace = true }
bytes = { workspace = true }
crossbeam-epoch = { workspace = true }
crossbeam-queue = { workspace = true }
crossbeam-utils = { workspace = true }
dashmap = { workspace = true }
diffy = { workspace = true }
fastcdc = { workspace = true }
futures = { workspace = true }
glob-match = { workspace = true }
governor = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
infer = { workspace = true }
jsonwebtoken = { workspace = true }
libc = { workspace = true }
open = { workspace = true }
opentelemetry = { workspace = true }
parking_lot = { workspace = true }
pin-project = { workspace = true }
prost-types = { workspace = true }
quinn = { workspace = true }
rand = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
lore-base = { workspace = true }
lore-error-set = { workspace = true }
lore-credential = { workspace = true }
lore-io = { workspace = true }
lore-storage = { workspace = true }
lore-macro = { workspace = true }
lore-proto = { workspace = true }
lore-telemetry = { workspace = true }
lore-transport = { workspace = true }
uuid = { workspace = true, features = ["zerocopy"] }
xxhash-rust = { workspace = true }
zerocopy = { workspace = true }

[target.'cfg(target_family = "windows")'.dependencies]
# `Win32_Storage_FileSystem` does not imply `Win32_Foundation`, and instance
# staleness reads its error constants from the latter, so both are named here.
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_ProjectedFileSystem",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_Security",
] }

[target.'cfg(target_os = "linux")'.dependencies]
lore-fuse = { version = "0.13.1-nightly", path = "../fuse", package = "aphrody-lore-fuse" }

# `MockTransport`, for provider tests that need the dispatcher's reply path.
[target.'cfg(target_os = "linux")'.dev-dependencies]
lore-fuse = { path = "../fuse", features = ["test-util"], package = "aphrody-lore-fuse" }

[[example]]
name = "state_bench"
path = "examples/state_bench/main.rs"
required-features = ["state-bench"]

# The node operations' stress harness, run by hand through `scripts/state-stress/stress.py`, which
# enables `state-stress`. Naming the feature keeps `cargo test` and builds of all targets from
# building it.
[[example]]
name = "state_stress"
path = "examples/state_stress/main.rs"
required-features = ["state-stress"]

[dev-dependencies]
ctor = { workspace = true }
dtor = { workspace = true }
keyring-core = { workspace = true }
lore-base = { path = "../base", package = "aphrody-lore-base", features = [
  "test-util",
] }
lore-revision = { path = ".", package = "aphrody-lore-revision", features = [
  "test-util",
] }
lore-storage = { path = "../storage", package = "aphrody-lore-storage", features = ["test-util"] }
lore-transport = { path = "../transport", package = "aphrody-lore-transport", features = ["test-util"] }
serde_json = { workspace = true }
serde = { workspace = true }
# `start_paused` for the tests that drive a polling loop on a virtual clock.
tokio = { workspace = true, features = ["test-util"] }
trybuild = { workspace = true }

[features]
default = []
oodle = ["lore-storage/oodle"]
integration_tests = []
compile_fail_tests = []
failure_generator = []
seeding = []
trace_log = ["lore-base/trace_log"]
vfs = []
test-util = []
# A build the instruction gate counts (`state-bench`, and lore's `revision-tree-bench`): the
# test-only lock counters (`state::lock_counting`, `node::read_contention`) count nothing, so the
# count measures the paths that ship. Examples build with the dev-dependencies, which turn on
# test-util.
bench = []
# The node operation bench, run by hand: `cargo run --release -p lore-revision --example
# state_bench --features state-bench`. Naming the feature keeps `cargo test` and builds of all
# targets from building it.
state-bench = ["bench"]
# The node operations' scheduling points (`state::node::hooks`), which the stress harness drives:
# enabled by `state-stress` alone, so no other build or test run carries them. Benchmarks never
# build with it.
state-hooks = []
# The builds of the stress harness, with the scheduling points and the test utilities it drives:
# the stress example (`examples/state_stress`) and the deterministic scenarios
# (`tests/state_scenarios`), both run by hand.
state-stress = ["state-hooks", "test-util"]

[[test]]
name = "compile_fail"
required-features = ["compile_fail_tests"]

# The node operations' deterministic scenarios, run by hand: naming the feature keeps a plain
# `cargo test` testing the build that ships, without the scheduling points.
[[test]]
name = "state_scenarios"
path = "tests/state_scenarios/main.rs"
required-features = ["state-stress"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
# lore-server's telemetry reads cfg(tokio_unstable). Declared here because a crate cannot
# have its own lints table alongside `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 } # TODO(raghav.narula) Enable after duplicate dependencies fixed
# undocumented_unsafe_blocks = "warn" # TODO(raghav.narula) enable in follow up
checked_conversions = "warn"
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
