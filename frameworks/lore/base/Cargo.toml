[package]
repository.workspace = true
description = "Lore version control: lore-base (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore-base"
edition = "2024"
version = "0.13.1-nightly"

[lib]
name = "lore_base"
test = false

# Writes the build version into finished artifacts; see src/version.rs.
[[bin]]
name = "lore-stamp"
path = "src/bin/lore-stamp.rs"

[features]
trace_log = []
# The shared test temp-directory helper in src/test_util.rs. Crates whose tests
# need scratch space on disk enable it from their dev-dependencies, so it stays
# out of every normal build.
test-util = ["dep:tempfile"]
# Tells build.rs to compile the rpmalloc C code with -mcpu=neoverse-512tvb.
neoverse-512tvb = []

[dependencies]
backtrace = { workspace = true, features = ["std"] }
libc = { workspace = true }
parking_lot = { workspace = true }
zerocopy = { workspace = true }

# directories
directories = { workspace = true }

# error
hex = { workspace = true }
thiserror = { workspace = true }
lore-error-set = { workspace = true }

# types
bitcode = { workspace = true }
bitflags = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
# Built only when `test-util` is on, so it stays out of normal builds. It is a
# normal optional dependency rather than a dev-dependency because a dependent
# enabling the feature compiles lore-base normally, and a normal build cannot see
# dev-dependencies.
tempfile = { workspace = true, optional = true }
serde = { workspace = true }
uuid = { workspace = true, features = ["zerocopy"] }

# log
chrono = { workspace = true }

# runtime
lore-io = { workspace = true }
pin-project = { workspace = true }
tokio = { workspace = true }

# tests
lore-macro = { workspace = true }

# fs
[target.'cfg(target_family = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_ProjectedFileSystem",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_Security",
] }

[dev-dependencies]
# The crate's tests, the unit tests and the lore-stamp tests included, are built against the
# library as other crates see it, without the `test` cfg, so they reach test_util through the feature.
lore-base = { path = ".", features = ["test-util"], package = "aphrody-lore-base" }
# Its serde integration: the non-self-describing format the identifier types' serde impls must
# round-trip through.
bitcode = { workspace = true, features = ["serde"] }
serde_json = { workspace = true, features = ["std"] }

[build-dependencies]
cc = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
# lore-server's telemetry reads cfg(tokio_unstable). Declared here because a crate cannot
# have its own lints table alongside `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 } # TODO(raghav.narula) Enable after duplicate dependencies fixed
# undocumented_unsafe_blocks = "warn" # TODO(raghav.narula) enable in follow up
checked_conversions = "warn"
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
