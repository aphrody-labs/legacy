[package]
repository.workspace = true
description = "Lore version control: lore (absorbed from Epic Games Lore, MIT)"
license = "MIT"
name = "aphrody-lore"
edition = "2024"
version = "0.13.1-nightly"

[lib]
name = "lore"
test = false

[dependencies]
bitcode = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
lore-base = { workspace = true }
lore-io = { workspace = true }
lore-storage = { workspace = true }
lore-revision = { workspace = true }
lore-credential = { workspace = true }
lore-transport = { workspace = true }
lore-error-set = { workspace = true }
lore-macro = { workspace = true }
lore-notification = { workspace = true }

[target.'cfg(target_family = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
] }

[features]
default = []
oodle = ["lore-revision/oodle"]
test-util = []
# The `revision_tree_bench` example, built only on demand.
revision-tree-bench = [
  "test-util",
  "lore-base/test-util",
  "lore-revision/bench",
]
# The C API's scenarios of the State's node operations (`tests/state_scenarios`), which drive
# lore-revision's scheduling points and so run only by hand.
state-stress = ["lore-revision/state-stress"]

[dev-dependencies]
async-trait = { workspace = true }
# The unit-test binary's process sandbox, set up before the harness starts; see tests/unit/main.rs.
ctor = { workspace = true }
lore-base = { path = "./base", package = "aphrody-lore-base", features = [
  "test-util",
] }
lore-storage = { path = "./storage", package = "aphrody-lore-storage", features = ["test-util"] }
# The tests that write node blocks directly (`NodeBlock::write_for_tests`).
lore-revision = { path = "./revision", package = "aphrody-lore-revision", features = ["test-util"] }
# The futures of the State node harness the C API's scenarios include.
pin-project = { workspace = true }
rand = { workspace = true }
serial_test = { workspace = true }
lore = { path = ".", package = "aphrody-lore", features = ["test-util"] }

[[example]]
name = "revision_tree_bench"
path = "examples/revision_tree_bench/main.rs"
required-features = ["revision-tree-bench"]

# The C API's scenarios of the State's node operations, run by hand: naming the feature keeps a
# plain `cargo test` testing the build that ships, without lore-revision's scheduling points.
[[test]]
name = "state_scenarios"
path = "tests/state_scenarios/main.rs"
required-features = ["state-stress"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
# lore-server's telemetry reads cfg(tokio_unstable). Declared here because a crate cannot
# have its own lints table alongside `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 } # TODO(raghav.narula) Enable after duplicate dependencies fixed
# undocumented_unsafe_blocks = "warn" # TODO(raghav.narula) enable in follow up
checked_conversions = "warn"
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
