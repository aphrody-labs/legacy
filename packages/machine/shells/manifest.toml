# Config files deployed by `bun packages/machine/src/shells.ts` (called by apply-user.ts).
# [[link]]
#   shell : bash | pwsh | powershell | nu | fish (sert au stub de mode "source")
#   src   : relative to packages/machine/shells/
#   dst   : string, or table { windows = "...", linux = "..." }; a missing platform = ignored.
#           ~ = USERPROFILE/HOME ; {appdata} = %APPDATA% ; {config} = ~/.config (Linux)
#   mode  : "source" = dst becomes a one-line stub that sources src in the repository (no symlink:
#           SeCreateSymbolicLink not guaranteed); "copy" = byte-for-byte copy (formats without include).
# --check: stub/copy different or missing => DIFF.

# nushell (agent C) : config-path / env-path de `$nu` (0.117.0).
[[link]]
shell = "nu"
src = "nu/env.nu"
dst = { windows = "{appdata}/nushell/env.nu", linux = "{config}/nushell/env.nu" }
mode = "source"

[[link]]
shell = "nu"
src = "nu/config.nu"
dst = { windows = "{appdata}/nushell/config.nu", linux = "{config}/nushell/config.nu" }
mode = "source"

# fish (agent C): Linux only, no native upstream Windows build (README 4.9.3: WSL, Cygwin, MSYS2).
[[link]]
shell = "fish"
src = "fish/config.fish"
dst = { linux = "{config}/fish/config.fish" }
mode = "source"

# carapace spec of `ay` (generated from `ay --help`): completion shared by bash/pwsh/nu/fish.
[[link]]
shell = "carapace"
src = "completions/ay.yaml"
dst = { windows = "{appdata}/carapace/specs/ay.yaml", linux = "{config}/carapace/specs/ay.yaml" }
mode = "copy"

[[link]]
shell = "fish"
src = "completions/ay.fish"
dst = { linux = "{config}/fish/completions/ay.fish" }
mode = "copy"

# --- bash family (agent A) ---
# niubash 1.5.0 (bash.exe = niu.exe) : login -> ~/.bash_profile ; interactif -> ~/.niubashrc seul.
# Git Bash 5.3 et brush 0.4 : login -> ~/.bash_profile ; interactif -> ~/.bashrc (brush : puis ~/.brushrc).
# Claude Code also sources ~/.bashrc for its snapshot. Details: docs/native/shell/bash-setup.md.
[[link]]
shell = "bash"
src = "bash/bashrc"
dst = "~/.bashrc"
mode = "source"

[[link]]
shell = "bash"
src = "bash/bash_profile"
dst = "~/.bash_profile"
mode = "source"

[[link]]
shell = "bash"
src = "bash/niubashrc"
dst = { windows = "~/.niubashrc" }
mode = "source"

# readline has no portable `source` ($include depends on the path format): copy.
[[link]]
shell = "bash"
src = "bash/inputrc"
dst = "~/.inputrc"
mode = "copy"

# --- pwsh (agent B) ---
# Single canonical profile for pwsh 7.7 (Store) and Windows PowerShell 5.1 (5.1-compatible code, 7+ sections kept).
# mode "copy": the Coreutils for Windows block ("DO NOT MODIFY … 60b36fc6") is included in the profile; its marker
# present in $PROFILE keeps the Coreutils installer from rewriting it. Settings and sources: docs/native/shell/pwsh-setup.md.
[[link]]
shell = "pwsh"
src = "pwsh/profile.ps1"
dst = { windows = "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" }
mode = "copy"

[[link]]
shell = "powershell"
src = "pwsh/profile.ps1"
dst = { windows = "~/Documents/WindowsPowerShell/Microsoft.PowerShell_profile.ps1" }
mode = "copy"

# Windows Terminal (settings.json, JSONC): target state checked by shells.ts --check (read-only;
# apply-user.ts sets the elevated Niubash default profile). Key = profile name.
[terminal]
default = "Niubash"
[terminal.profile.Niubash]
commandline = '{localappdata}\Programs\Niubash\niu.exe'
elevate = true
[terminal.profile."Git Bash"]
hidden = true
[terminal.profile.PowerShell]
commandline = "pwsh.exe -NoLogo"
[terminal.profile.brush]
commandline = '%USERPROFILE%\.local\share\brush-main\brush.exe -l'
[terminal.profile.Nushell]
source = "nu"
