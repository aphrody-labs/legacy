# Official Alacritty v0.16 configuration (Catppuccin Mocha + Google Sans Code 20px)
[general]
live_config_reload = true

[window]
padding = { x = 8, y = 6 }
dynamic_padding = true
decorations = "Full"

[scrolling]
history = 50000

[font]
size = 20.0

[font.normal]
family = "Google Sans Code"
style = "Regular"

[font.bold]
family = "Google Sans Code"
style = "Bold"

[font.italic]
family = "Google Sans Code"
style = "Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }

[colors.primary]
background = "#1E1E2E"
foreground = "#CDD6F4"

[colors.cursor]
text = "#1E1E2E"
cursor = "#F5E0DC"

[colors.selection]
text = "#CDD6F4"
background = "#45475A"

[colors.normal]
black = "#45475A"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#BAC2DE"

[colors.bright]
black = "#585B70"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#F5C2E7"
cyan = "#94E2D5"
white = "#A6ADC8"
