<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="currentColor">
  <!-- Aphrody monogram without its tile, one color: it takes the color of the text around it (currentColor).
       The cut around the bolt is a mask instead of a background-colored stroke, so it works on any ground.
       Not run through usvg, which would resolve currentColor to a fixed color. -->
  <defs>
    <mask id="ay-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect width="48" height="48" fill="#fff"/>
      <path fill="none" stroke="#000" stroke-width="3.2" stroke-linejoin="round" d="M6.5 32.2L25.6 35.6L28.2 29.6L41.5 27.8L22.4 24.4L19.8 30.4Z"/>
    </mask>
  </defs>
  <path mask="url(#ay-cut)" d="M24 9L39 39H31L24 25L17 39H9Z"/>
  <path d="M6.5 32.2L25.6 35.6L28.2 29.6L41.5 27.8L22.4 24.4L19.8 30.4Z"/>
</svg>
