# Aphrody brand: single source of truth for every logo, icon, token, banner, badge and social image
# of the monorepo. `ay brand build` (src/ui/kit/src/brand) reads this file and writes packages/design/brand/gen/.
# All artwork is original (see LICENSE). No third-party character, logo or game asset is used.

[brand]
name = "Aphrody"
# CDN path version: https://cdn.aphrody.com/brand/v<version>/... (immutable; bump on any visual change).
# v1 and v2 predate the sapphire seed and the zukan palette; v3 is the first release of this seed.
version = 3
# Material 3 dynamic scheme seed (Byron Love sapphire, packages/design reads it too) and variant.
seed = "#135B82"
variant = "vibrant"
# The bolt accent (gold), an M3 custom color harmonized nowhere: it stays the same hue in every theme.
accent = "#D1D293"
# Typeface: Google Sans Flex (SIL OFL 1.1, no Reserved Font Name; google/fonts ofl/googlesansflex).
# Trademark terms (TRADEMARKS.md upstream): the font name must not be used as or within a product name.
font = "Google Sans Flex"
font_fallback = ["Roboto Flex", "Inter", "system-ui", "sans-serif"]
# The file that shapes every outlined text (logos, cards, badges): the [[font]] of the family above, fetched
# by `ay assets brand-inputs` into gen-cache/, which `ay brand build` never deletes.
font_file = "gen-cache/fonts/google-sans-flex.ttf"

# Provenance of the Zukan palette (packages/assets zukan-brand crawl: gen/zukan, gen/themes). Not read by the build.
[zukan]
source_url = "https://zukan.inazuma.jp/en/chara_list/?q=hN2RnpKaoIyano2cl93FpN2-j5eNkJuG392igg=="
character = "Byron Love (Aphrody)"
primary_seed = "#135B82"
gold_accent = "#D1D293"
go_crimson = "#EA6A6A"
ares_flame = "#C63F00"

# The two organisations. `container` is the tile behind the monogram.
[[org]]
id = "aphrody-labs"
name = "Aphrody"
suffix = "Labs"
tagline = "Systems, runtimes and desktops in Rust and Bun"
container = "primary"
url = "https://github.com/aphrody-labs"
# The unprefixed files of docs/logo (logo.svg, logo-with-wordmark-*.svg) are this organisation's.
primary = true

[[org]]
id = "aphrody-dev"
name = "Aphrody"
suffix = "Dev"
tagline = "Upstream work on Bun, Rust and the Windows platform"
container = "ink"
url = "https://github.com/aphrody-dev"

# One icon per product: an M3 rounded tile in the product hue (HCT, chroma 56, tone 40) and a
# Material Symbols Rounded glyph (Apache-2.0, packages/design/brand/symbols/NOTICE).
# Sites read their icon set from gen/icons/<id>/ at build time (packages/deploy, aphrody-app
# dist.rs): no copy. `ico` lists the Windows .ico copies embedded in binaries (crates/ay/ay.ico).
[[product]]
id = "ay"
name = "ay"
symbol = "terminal"
hue = 268
tagline = "One multicall CLI for the monorepo"
path = "src/ay"
ico = ["src/ay/ay.ico"]

[[product]]
id = "nt"
name = "nt"
symbol = "desktop_windows"
hue = 236
tagline = "This machine's Windows NT, rendered entirely by the GPU"
path = "apps/nt"
# MSIX logos (icons/nt/msix/), linked by apps/nt/base/shell/explorer/Nt.App.csproj.
msix = true

[[product]]
id = "ai-os"
name = "ai-os"
symbol = "neurology"
hue = 322
tagline = "Agent core, model bridge, relay and TUI in one Bun package"
path = "packages/ai-os"

[[product]]
id = "relay"
name = "relay"
symbol = "hub"
hue = 190
tagline = "MCP, A2A and ACP relay of ai-os"
path = "packages/ai-os/src/relay"

[[product]]
id = "unixwin"
name = "unixwin"
symbol = "conversion_path"
hue = 150
tagline = "Native Windows bash and coreutils in Rust"
path = "apps/unixwin"

[[product]]
id = "aphrody"
name = "aphrody.com"
symbol = "bolt"
hue = 290
tagline = "Merged static SEO and brand asset portal (aphrody.com / aphrody.app)"
path = "apps/aphrody"

[[product]]
id = "shenron"
name = "Shenron"
symbol = "local_fire_department"
hue = 40
tagline = "dragonballfr.com: site, Discord bot, translation pipeline"
path = "apps/shenron"

[[product]]
id = "rosegriffon"
name = "Rose Griffon"
symbol = "sports_soccer"
hue = 12
tagline = "rosegriffon.fr: website, Discord bots, unified API"
path = "apps/rosegriffon"

# The global types of the monorepo, one icon each (docs/icons/<id>.svg tile, docs/icons/glyphs/<id>.svg in
# currentColor). The catalog generator (scripts/catalog.ts) puts the same id on every package, crate and app README.
# Same tile as a product; hue in degrees (HCT, chroma 56, tone 40).
[[type]]
id = "crate"
name = "Rust crate"
symbol = "deployed_code"
hue = 28
description = "A member of the Cargo workspace (src/*)"

[[type]]
id = "package"
name = "Bun package"
symbol = "inventory_2"
hue = 215
description = "A Bun workspace package (@aphrody/*)"

[[type]]
id = "app"
name = "App"
symbol = "web_asset"
hue = 262
description = "An application or site (apps/*)"

[[type]]
id = "infra"
name = "Infrastructure"
symbol = "dns"
hue = 190
description = "Fleet, deploy and CI configuration (infra/*)"

[[type]]
id = "third-party"
name = "Upstream"
symbol = "fork_right"
hue = 340
description = "An upstream checkout or fork pinned in src.lock.json (third_party/*)"

[[type]]
id = "skill"
name = "Agent skill"
symbol = "psychology"
hue = 130
description = "A skill of .agents/skills"

# Static README badges (no badge service). `value = "@rust-toolchain"` is read from
# rust-toolchain.toml at build time so a badge never states an unverified version.
[[badge]]
id = "license"
label = "license"
value = "MIT OR Apache-2.0"

[[badge]]
id = "rust"
label = "rust"
value = "@rust-toolchain"

[[badge]]
id = "bun"
label = "runtime"
value = "bun"

[[badge]]
id = "main-only"
label = "workflow"
value = "main only"

# ---------------------------------------------------------------------------------------------
# Web asset pipeline (`ay brand build`, src/ui/kit/src/brand/web.rs). Every output lands in gen/ and is listed
# with its sha256 in gen/manifest.json; `ay brand check` verifies it. The CDN path (cdn.aphrody.com/brand/v<version>/)
# is the manifest `base`; uploading is not part of `ay brand`.

# Material Symbols Rounded (Apache-2.0, google/material-design-icons at the commit of inputs.lock.json): the
# only icons of the sites. Outputs: gen/symbols/sprite.svg (<symbol id="name"> and "name-fill"),
# one optimized SVG per icon, symbols.json (path data and codepoint) and the variable font
# (FILL, GRAD, opsz, wght) subset to exactly these ligatures. Keep the list sorted.
[symbols]
font_file = "gen-cache/symbols/MaterialSymbolsRounded.ttf"
codepoints_file = "gen-cache/symbols/MaterialSymbolsRounded.codepoints"
names = [
  "apps",
  "arrow_back",
  "auto_awesome",
  "bolt",
  "check",
  "close",
  "code",
  "conversion_path",
  "dashboard",
  "desktop_windows",
  "devices",
  "download",
  "hub",
  "layers",
  "local_fire_department",
  "menu",
  "neurology",
  "palette",
  "play_arrow",
  "refresh",
  "rocket_launch",
  "search",
  "settings",
  "speed",
  "sports_soccer",
  "storefront",
  "terminal",
  "tune",
  "view_quilt",
]

# Web fonts: SIL OFL 1.1 only, no Reserved Font Name (`ay assets brand-inputs` checks OFL.txt), from google/fonts at
# the latest commit, recorded in inputs.lock.json with the git blob SHA-1 of every file. Subset to the Latin range of
# Google Fonts (French included), every variable axis kept, WOFF2. gen/fonts/fonts.css declares
# them (font-display swap, axis ranges read from fvar); `preload = true` fonts go in fonts.json
# `preload` for <link rel=preload>.
[[font]]
id = "google-sans-flex"
family = "Google Sans Flex"
path = "ofl/googlesansflex/GoogleSansFlex[ROND,opsz,slnt,wdth,wght].ttf"
# Not preloaded: five axes (ROND, opsz, slnt, wdth, wght) keep the Latin WOFF2 near 0.9 MB.

[[font]]
id = "google-sans-code"
family = "Google Sans Code"
path = "ofl/googlesanscode/GoogleSansCode[wght].ttf"

[[font]]
id = "roboto-flex"
family = "Roboto Flex"
path = "ofl/robotoflex/RobotoFlex[GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC,opsz,slnt,wdth,wght].ttf"

[[font]]
id = "inter"
family = "Inter"
path = "ofl/inter/Inter[opsz,wght].ttf"

[[font]]
id = "geist"
family = "Geist"
path = "ofl/geist/Geist[wght].ttf"

[[font]]
id = "geist-mono"
family = "Geist Mono"
path = "ofl/geistmono/GeistMono[wght].ttf"

[[font]]
id = "atkinson-hyperlegible-next"
family = "Atkinson Hyperlegible Next"
path = "ofl/atkinsonhyperlegiblenext/AtkinsonHyperlegibleNext[wght].ttf"
preload = true

# Responsive raster images: every social card and wordmark in AVIF and WebP at these widths
# (gen/img/, srcset strings in gen/img/srcset.json). The 1200 x 630 PNG stays for og:image.
[images]
widths = [480, 960, 1200]
avif_quality = 60
webp_quality = 82

# Wallpapers and backgrounds (original artwork, src/wallpaper.svg): AVIF + WebP at every size;
# 16:9 sizes share one srcset (img/wallpaper/<id>-<w>), portrait sizes go to <id>-portrait.
[[wallpaper]]
id = "aphrody-labs"
mark = "aphrody-labs"
template = "src/wallpaper.svg"
sizes = ["1920x1080", "2560x1440", "3840x2160", "1290x2796"]

[[wallpaper]]
id = "nt"
mark = "nt"
template = "src/wallpaper.svg"
sizes = ["1920x1080", "2560x1440", "3840x2160"]

# Stills of our products only (owner rule: no stock, no third-party or Level-5 asset), taken by the site agent
# (docs/proofs) and reused as is (file = path from the root); the build encodes them to AVIF + WebP srcsets.
# rosegriffon.fr is not captured: its pages show Inazuma Eleven (Level-5) artwork, which no brand asset may carry.
[[capture]]
id = "aphrody-com"
url = "https://aphrody.com/"
file = "docs/proofs/sites-2026-11-13/after/aphrody.com.png"
widths = [640, 1280]

[[capture]]
id = "yolo"
url = "https://yolo.aphrody.com/"
file = "docs/proofs/sites-2026-11-13/after/yolo.aphrody.app.png"
widths = [640, 1280]

# 3D: the brand tile as glTF 2.0 binary (gen/model/<id>.glb), geometry from src/ui/kit/src/brand/gpu.rs,
# EXT_meshopt_compression buffers, base color in KTX2 (UASTC + zstd, KHR_texture_basisu).
[model]
ids = ["aphrody-labs", "aphrody-dev"]

# Image-based lighting for the PBR model: Poly Haven "Studio Small 09" (CC0 1.0), 1k OpenEXR fetched
# by `ay assets brand-inputs` (sha256 below verified), written as KTX2 RGBA16F (zstd).
[environment]
id = "studio_small_09"
file = "gen-cache/env/studio_small_09_1k.exr"
license = "CC0 1.0 (https://polyhaven.com/license), Sergej Majboroda / Poly Haven"
source = "https://polyhaven.com/a/studio_small_09"
url = "https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/studio_small_09_1k.exr"
sha256 = "44dcbed056512ecd8afd2a3d7ba73d2dd4c24694d0c72005fafcb2469bbc8fd4"

# Minimal wasm + WebGPU renderer of the same tile (gen/gpu/: brand-gpu.wasm from
# src/ui/kit/src/brand/gpu_wasm.rs, brand-gpu.js from packages/design/brand/web/gpu.ts). Without WebGPU the <img>
# fallback inside the element stays.
[gpu]
loader = "web/gpu.ts"
