[toolchain]
# One LLVM for src and Chromium (owner rule, skill llvm-toolchain): the Rust toolchain Chromium
# builds on its own LLVM (rustc 1.101.0-nightly, LLVM 24.0.0), the LLVM of Chromium's clang/lld, pinned by the newest
# third_party/toolchain-<milestone>.toml. Custom rustup toolchain of that milestone, linked by
# `bun scripts/toolchain.ts install` (PC, fr1, fr2, CI). A bump is a new toolchain-<milestone>.toml plus this line.
channel = "chromium-160"
components = ["rustfmt", "clippy", "rust-src"]
profile = "minimal"
