# Bun's lint tables, verbatim. First-party crates declare their own [lints] inline (one table per manifest).
[workspace.lints.rust]
# Every rustc warning is an error. Individual lints below can override this
# back to "warn" (their priority 0 beats the group's -1) where a warning level
# is intentional.
warnings = { level = "deny", priority = -1 }
# `bun_asan` / `bun_debug` / `socket_fault_injection` are set via RUSTFLAGS
# (`--cfg=...` + `--check-cfg=cfg(...)`) by scripts/build/rust.ts; register
# them here so a plain `cargo build` / `cargo check` (without those flags)
# doesn't warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bun_asan)', 'cfg(bun_debug)', 'cfg(bun_fuzzilli)', 'cfg(bun_hardened)', 'cfg(bun_locked_environment)', 'cfg(bun_refuses_execute_only_start)', 'cfg(bun_starts_without_mdwe)', 'cfg(socket_fault_injection)', 'cfg(bun_disallow_code_generation_from_strings)', 'cfg(bun_sema_mimalloc)', 'cfg(mordant)'] }
# link.exe unconditionally prints "Creating library X.dll.lib and object
# X.dll.exp" to stdout when linking each proc-macro DLL on Windows hosts;
# there is no linker flag to suppress it. The lint already exempts itself
# from `-D warnings`, so this only silences the noise.
linker_messages = "allow"
dead_code = "deny"
# Every crate in this workspace is an internal implementation detail of one
# binary, so `pub` is a claim that *another crate* imports the item. If it
# doesn't, write `pub(crate)` — that keeps the item under `dead_code` analysis
# instead of being exempted as an external API root. Macro-generated items that
# must stay `pub` carry `#[allow(unreachable_pub)]` at the expansion site.
unreachable_pub = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
unused_assignments = "deny"
unused_macros = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"

[workspace.lints.clippy]
# == provenance-safe pointer casts ==
# Prefer `.cast::<T>()` / `.cast_const()` / `.cast_mut()` / `ptr::from_ref` /
# `ptr::from_mut` over `as *const T` / `as *mut T`. The method forms cannot
# accidentally change mutability or perform a ref→raw coercion in one step,
# and they preserve provenance under Strict Provenance.
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
borrow_as_ptr = "deny"

# == soundness / leak prevention ==
undocumented_unsafe_blocks = "deny"
not_unsafe_ptr_arg_deref = "deny"
mem_forget = "deny"
cast_ptr_alignment = "deny"
transmute_ptr_to_ptr = "deny"
as_ptr_cast_mut = "deny"
drop_non_drop = "deny"
uninit_vec = "deny"

# == performance ==
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
or_fun_call = "deny"
assigning_clones = "deny"
implicit_clone = "deny"
iter_overeager_cloned = "deny"
map_clone = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
large_enum_variant = "deny"
large_stack_frames = "deny"
vec_init_then_push = "deny"
format_collect = "deny"
manual_memcpy = "deny"
needless_pass_by_value = "deny"

# == clarity / api hygiene ==
unnecessary_unwrap = "deny"
derive_partial_eq_without_eq = "deny"
derivable_impls = "deny"
clone_on_ref_ptr = "deny"
if_same_then_else = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
clone_on_copy = "deny"
useless_conversion = "deny"
# vec_box / boxed_local: legit patterns are `#[expect]`-suppressed at the site
# with a one-line "why the box is load-bearing" comment (intrusive-list address
# stability, a task's reclaim point). Anything new must justify itself.
vec_box = "deny"
boxed_local = "deny"
arc_with_non_send_sync = "deny"
manual_swap = "deny"
mem_replace_option_with_none = "deny"
redundant_locals = "deny"
manual_c_str_literals = "deny"
precedence = "deny"
implicit_saturating_sub = "deny"
ptr_eq = "deny"

# == disallowed-* (configured in clippy.toml) ==
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

# == explicitly allowed (Zig-port style; intentional) ==
collapsible_if = "allow"
collapsible_else_if = "allow"
collapsible_match = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
len_zero = "allow"
len_without_is_empty = "allow"
needless_return = "allow"
module_inception = "allow"
missing_safety_doc = "allow"
let_unit_value = "allow"
needless_update = "allow"
explicit_auto_deref = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
enum_variant_names = "allow"
upper_case_acronyms = "allow"
wrong_self_convention = "allow"
should_implement_trait = "allow"
new_without_default = "allow"
self_named_constructors = "allow"  # Zig-port `Type::init()` constructor convention
single_match = "allow"
manual_range_contains = "allow"
needless_lifetimes = "allow"
needless_range_loop = "allow"
while_let_loop = "allow"
while_let_on_iterator = "allow"
blocks_in_conditions = "allow"
diverging_sub_expression = "allow"
declare_interior_mutable_const = "allow"
empty_line_after_doc_comments = "allow"
empty_docs = "allow"
excessive_precision = "allow"
unreadable_literal = "allow"
approx_constant = "allow"
result_unit_err = "allow"
only_used_in_recursion = "allow"
# `as u32` etc. is identity on some libc targets, required widen on others
unnecessary_cast = "allow"
new_ret_no_self = "allow"
map_identity = "allow"

# Edit-compile loop: dependencies at opt-level 1. Everything on LLVM: the Chromium Rust toolchain
# (rust-toolchain.toml) ships no Cranelift backend.
# Measurements and rejected levers: docs/BUILD_SPEED.md.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
# Only takes effect on Linux/macOS (no objcopy pass, faster links); MSVC always emits a PDB.
split-debuginfo = "unpacked"
incremental = true

# Dependencies: LLVM, opt-level 1, no debuginfo (smaller target/).
[profile.dev.package."*"]
codegen-backend = "llvm"
opt-level = 1
debug = false

[profile.test]
codegen-backend = "llvm"

# One release profile for every member: fat LTO, single codegen unit, abort on panic.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package.quinn]
debug-assertions = false

[profile.release.package.tokio]
debug-assertions = false

# Profile dist (dist-workspace.toml) builds release artifacts with; same settings as release.
[profile.dist]
inherits = "release"

# Bun profiles (oven-sh/bun Cargo.toml). profile.release and profile.dev stay ours (fat LTO, abort, stripped symbols;
# Bun's own lto = "off" belongs to its ninja link, which links the crate rlibs with C++).
[profile.release-profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Windows .bin launcher PE of bun_install (system/install/windows-shim), size-optimized.
[profile.shim]
inherits = "release"
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
debug-assertions = false
overflow-checks = false

# Loops over every byte of an image: unoptimized, a debug build takes seconds per megapixel.
[profile.dev.package.bun_png]
opt-level = 3

# It stands in for vector code that every test program runs over each byte it parses.
[profile.dev.package.bun_sema_standalone]
opt-level = 3

[profile.release.package.bun_react_compiler]
opt-level = "s"

[profile.release.package.bun_sema_baselines]
opt-level = "z"

[profile.release.package.bun_format_conformance]
opt-level = "z"

[profile.release.package.bun_lint_conformance]
opt-level = "z"

# Fast optimized local iteration (labs).
[profile.iteration]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = "none"
debug = "line-tables-only"
debug-assertions = true

# Size-optimized (labs).
[profile.min]
inherits = "release"
opt-level = "z"
panic = "immediate-abort"

# Bun-style AOT release profile (fat LTO, single codegen unit, immediate-abort, stripped).
[profile.aot]
inherits = "release"
panic = "immediate-abort"

# [profile.dev.package.ring3-agent] removed (crate purged).
[patch.crates-io]
# aphrody-dev forks: russh with sntrup761x25519-sha512 (OpenSSH hybrid PQ kex), pure-Rust sntrup761.
# Every git source is pinned by rev (branch noted for `ay lock --deps --bump`).
russh = { git = "https://github.com/aphrody-dev/russh", rev = "a9f644259fa57ddb2da0f980e6ae813b829f7ad4" } # aphrody/sntrup761
sntrup761 = { git = "https://github.com/aphrody-labs/sntrup761", rev = "54e3a99495e974586085df0c86583eb7c606854e" } # aphrody/pure-rust
age = { git = "https://github.com/aphrody-labs/rage", rev = "b5b68c4f4f7ea5c368bc060f6fe0237549c3a13f" } # main: ml-kem 0.3 (kem 0.3 shared with russh); 0.12.1 on crates.io needs kem 0.3.0-pre.0
# Lore patches (sites marked `LORE:`), formerly vendored in third_party/patches.
# quinn-proto 0.11.19 + max_rtt, is_crypto, windowed BBR min_rtt, bounded BBR window.
quinn-proto = { git = "https://github.com/aphrody-labs/quinn", rev = "6e76339be91de7b5784cca640307329d1cf372a2" } # aphrody/lore
# glob-match 0.2.1 (upstream idle since 2024-08) + `**` backtracking fix, gitignore component semantics.
glob-match = { git = "https://github.com/aphrody-labs/glob-match", rev = "2307a20a449d9419947be65b5d904fc0a880feb0" } # aphrody/lore
# First-party absorbed Taffy 0.15.1 Layer-0 kernel.
taffy = { path = "frameworks/taffy" }
