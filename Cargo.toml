# Bun crates (system/<name>, upstream names and layout). Where a key is also ours, ours is kept when it is the same major and
# not older (getrandom, bstr, libc, bitflags, thiserror, smallvec); rustix keeps Bun's 0.38 and system/machine depends on 1.x directly.
